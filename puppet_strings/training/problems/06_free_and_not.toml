answer = "REQUEST staff.pip NOT DO 'lifeguard' ON ANY dates.session_6"
alternatives = ["REQUEST staff.pip NOT DO 'lifeguard' ON ANY {2026-08-02 .. 2026-08-08}"]
wrong = ["REQUEST staff.pip NOT DO 'lifeguard'"]

[[problem]]
id = "free-busy-one-evening"
title = "Busy at least once"
prompt = "Hails has something to do in at least one of the evening blocks. The other can be free."
answer = "REQUEST staff.hails BUSY DURING ANY 1 blocks.evening"
hints = ["Pick an evening block for her to be busy in."]
explain = "ALL blocks.evening would be busy in every one of them; ANY 1 picks one."

alternatives = ["REQUEST staff.hails BUSY DURING ANY blocks.evening"]
wrong = ["REQUEST staff.hails BUSY DURING ALL blocks.evening"]

[[problem]]
id = "free-not-both"
title = "Not both"
prompt = "Lisa shouldn't run a clinic in both clinic 1 and clinic 2. A clinic in one of them is fine."
answer = "REQUEST staff.lisa NOT DO ANY activities.clinics DURING ALL {blocks.clinic_1 + blocks.clinic_2}"
hints = ["What must not happen is a clinic in clinic 1 and a clinic in clinic 2, together: ALL, right of NOT."]
explain = "Right of NOT, ALL is all of them together, so one on its own is fine. Said as a count of what does happen, it is the same: DO ANY activities.clinics DURING AT_MOST 1 of the two."
alternatives = ["REQUEST staff.lisa DO ANY activities.clinics DURING AT_MOST 1 {blocks.clinic_1 + blocks.clinic_2}"]
wrong = ["REQUEST staff.lisa NOT DO ANY activities.clinics DURING ANY {blocks.clinic_1 + blocks.clinic_2}"]
