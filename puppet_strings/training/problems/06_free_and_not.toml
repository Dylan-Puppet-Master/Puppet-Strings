[level]
name = "FREE, BUSY and NOT"
blurb = "Keeping people free, busy, or off something."
day = "2026-08-04"
teaches = """
REQUEST <who> FREE DURING <blocks>        nothing assigned then
REQUEST <who> BUSY DURING <blocks>        something assigned then
REQUEST <who> NOT DO <what> ...           never doing that

REQUEST staff.dylan FREE DURING blocks.playstation
REQUEST staff.hails BUSY DURING ANY 1 blocks.evening
REQUEST staff.rob NOT DO 'break' DURING ANY blocks.meals

• Everything right of NOT is the situation that must not happen
• There, ANY <set> means "any of these", and ALL <set> "all of these together"
• ANY n or a count never goes right of NOT: cap what does happen instead
• NOT DO can leave out DURING: then it's all day
• The subject is who the NOT is about: ALL {…} NOT DO means none of them does
"""

[[problem]]
id = "free-dylan-playstation"
title = "A free hour"
prompt = "Dylan should be free — nothing assigned — during playstation."
answer = "REQUEST staff.dylan FREE DURING blocks.playstation"
hints = ["FREE takes the place of DO and the task."]
explain = "FREE means working that day, with nothing assigned in that block."
wrong = [
  "REQUEST staff.dylan BUSY DURING blocks.playstation",
  "REQUEST staff.dylan NOT DO 'break' DURING blocks.playstation",
]

[[problem]]
id = "free-day-off"
title = "Clear all day"
prompt = "Vic is on call all Thursday: at camp, but with nothing assigned in any block."
answer = "REQUEST staff.vic FREE DURING ALL blocks ON dates.session_6.week_1.thursday"
priority = "MUST_HAPPEN"
hints = ["Free in every block: FREE DURING ALL blocks."]
alternatives = ["REQUEST staff.vic FREE DURING ALL blocks ON 2026-08-06", "REQUEST staff.vic FREE DURING EACH blocks ON 2026-08-06"]
explain = "FREE is somebody at camp with nothing to do. Somebody away for the day is an EXCLUDE, which comes later."
wrong = ["REQUEST staff.vic FREE DURING ANY 1 blocks ON 2026-08-06"]

[[problem]]
id = "free-not-free"
title = "Keep them busy"
prompt = "Every counselor should have something to do during clinic 1. Each counselor counts on their own."
answer = "REQUEST EACH staff.counselors BUSY DURING blocks.clinic_1"
priority = "HIGH"
explain = "BUSY means something is assigned. It doesn't say what — anything will do."
wrong = ["REQUEST EACH staff.counselors FREE DURING blocks.clinic_1"]

[[problem]]
id = "free-no-breaks-at-meals"
title = "No breaks at meals"
prompt = "Rob shouldn't take a 'break' during any meal."
answer = "REQUEST staff.rob NOT DO 'break' DURING ANY blocks.meals"
hints = ["Right of NOT, ANY in front of a set means 'any of these'."]
alternatives = ["REQUEST staff.rob NOT DO 'break' DURING ANY {blocks.breakfast + blocks.lunch + blocks.dinner}"]
wrong = ["REQUEST staff.rob NOT DO 'break' DURING blocks.lunch"]

[[problem]]
id = "free-no-ropes-all-day"
title = "Off the ropes"
prompt = "Rob does no ropes clinic at all today."
answer = "REQUEST staff.rob NOT DO ANY activities.clinics.ropes"
hints = ["All the ropes clinics are a category: activities.clinics.ropes.", "Leave out DURING to mean all day."]
explain = "With no DURING, NOT DO covers the whole day."
alternatives = ["REQUEST staff.rob NOT DO ANY activities.clinics.ropes DURING ANY blocks"]
wrong = ["REQUEST staff.rob NOT DO ANY activities.clinics.ropes DURING ANY {blocks.all_clinics - blocks.clinic_4}"]

[[problem]]
id = "free-each-director"
title = "Directors at playstation"
prompt = "Each director should be free during playstation, each counting on their own."
answer = "REQUEST EACH staff.directors FREE DURING blocks.playstation"
priority = "HIGH"
wrong = [
  "REQUEST ALL staff.directors FREE DURING blocks.playstation",
  "REQUEST EACH staff.directors FREE DURING blocks.rest_hour",
]

[[problem]]
id = "free-none-of-them"
title = "Nobody on felting"
prompt = "None of the directors runs Felting today."
answer = "REQUEST ALL staff.directors NOT DO activities.clinics.felting"
explain = "The subject is who the NOT is about. ALL staff.directors NOT DO … is 'none of them does it'."
alternatives = ["REQUEST ALL {staff.david + staff.lisa + staff.matthew} NOT DO activities.clinics.felting"]
wrong = ["REQUEST ANY 1 staff.directors NOT DO activities.clinics.felting"]

[[problem]]
id = "free-one-of-them-not"
title = "At least one stays off"
prompt = "At least one of Rob and Vic stays off the canopy tour today."
answer = "REQUEST ANY 1 {staff.rob + staff.vic} NOT DO activities.clinics.canopy_tour_dbl"
explain = "ANY 1 on the left of NOT is 'one of them doesn't' — the solver picks who."
wrong = ["REQUEST ALL {staff.rob + staff.vic} NOT DO activities.clinics.canopy_tour_dbl"]

[[problem]]
id = "free-two-blocks"
title = "Free for the afternoon"
prompt = "Kara is free during both clinic 3 and clinic 4."
answer = "REQUEST staff.kara FREE DURING ALL {blocks.clinic_3 + blocks.clinic_4}"
wrong = ["REQUEST staff.kara FREE DURING ANY 1 {blocks.clinic_3 + blocks.clinic_4}"]

[[problem]]
id = "free-any-clinic-block"
title = "One free clinic"
