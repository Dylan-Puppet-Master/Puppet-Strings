priority = "HIGH"
explain = "Splitting small is how Skedge says 'avoid': each meal-break misses exactly one of the nine small requests."
wrong = [
  "REQUEST EACH staff.directors NOT DO 'break' DURING ANY blocks.meals",
  "REQUEST ALL staff.directors NOT DO 'break' DURING ANY blocks.meals",
]

[[problem]]
id = "free-not-clinics-morning"
