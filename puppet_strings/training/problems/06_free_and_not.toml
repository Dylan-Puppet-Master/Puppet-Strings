answer = "REQUEST staff.mogee FREE DURING ANY 1 blocks.all_clinics"
wrong = ["REQUEST staff.mogee FREE DURING ALL blocks.all_clinics"]

[[problem]]
id = "free-not-archery"
title = "Somebody else's turn"
prompt = "Tyson shouldn't run Archery 1 & 2 during clinic 2."
answer = "REQUEST staff.tyson NOT DO activities.clinics.archery_1_2 DURING blocks.clinic_2"
