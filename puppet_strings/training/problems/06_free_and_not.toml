answer = "REQUEST staff.hails BUSY DURING ALL blocks.evening"
hints = ["Every evening block: ALL blocks.evening."]
alternatives = ["REQUEST staff.hails BUSY DURING ALL {blocks.embers + blocks.evening_program}"]
wrong = ["REQUEST staff.hails BUSY DURING blocks.embers"]

[[problem]]
id = "free-whole-session-off"
