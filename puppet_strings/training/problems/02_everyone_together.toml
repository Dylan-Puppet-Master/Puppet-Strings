alternatives = ["REQUEST staff.jana DO 'camp store' DURING ALL_OF {blocks.clinic_2 + blocks.clinic_1}"]
wrong = ["REQUEST staff.jana DO 'camp store' DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}"]

[[problem]]
id = "together-evening"
