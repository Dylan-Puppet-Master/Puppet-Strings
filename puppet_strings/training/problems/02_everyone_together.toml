prompt = "Every village leader goes to a 'village huddle' during rest hour."
answer = "REQUEST ALL_OF staff.village_leaders DO 'village huddle' DURING blocks.rest_hour"
wrong = ["REQUEST ALL_OF staff.village_heroes DO 'village huddle' DURING blocks.rest_hour"]

[[problem]]
id = "together-three-names"
title = "Kitchen help"
prompt = "Kara, Khushi and Amber do 'kitchen help' during lunch."
answer = "REQUEST ALL_OF {staff.kara + staff.khushi + staff.amber} DO 'kitchen help' DURING blocks.lunch"
hints = ["{staff.kara + staff.khushi + staff.amber}"]
alternatives = ["REQUEST ALL_OF {staff.amber + staff.kara + staff.khushi} DO 'kitchen help' DURING blocks.lunch"]
wrong = ["REQUEST ALL_OF {staff.kara + staff.khushi} DO 'kitchen help' DURING blocks.lunch"]

[[problem]]
id = "together-all-meals"
title = "Every meal"
prompt = "Leah is on 'dish duty' at every meal today."
answer = "REQUEST staff.leah DO 'dish duty' DURING ALL_OF blocks.meals"
hints = ["The meals are a block category: blocks.meals.", "Sets of blocks need ALL_OF just like sets of people."]
explain = "blocks.meals is breakfast, lunch and dinner. ALL_OF asks for all three."
alternatives = ["REQUEST staff.leah DO 'dish duty' DURING ALL_OF {blocks.breakfast + blocks.lunch + blocks.dinner}"]
wrong = ["REQUEST staff.leah DO 'dish duty' DURING ALL_OF {blocks.lunch + blocks.dinner}"]

[[problem]]
id = "together-two-blocks"
