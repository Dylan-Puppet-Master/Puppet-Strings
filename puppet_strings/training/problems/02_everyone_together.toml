[level]
name = "Groups: ALL_OF"
blurb = "Sets of people and blocks, taken all at once."
day = "2026-08-04"
teaches = """
ALL_OF <set>        every one of them, together

REQUEST ALL_OF staff.directors DO 'meeting' DURING blocks.rest_hour
REQUEST ALL_OF {staff.rob + staff.vic} DO 'ropes check' DURING blocks.setup
REQUEST staff.rob DO 'break' DURING ALL_OF blocks.meals

• A category (staff.directors, blocks.meals) is a set
• {a + b} makes a set out of names
• A set in a request always says how it is taken: ALL_OF is all of them
"""

[[problem]]
id = "together-directors-meeting"
title = "Directors' meeting"
prompt = "All the directors have a 'directors meeting' during rest hour."
answer = "REQUEST ALL_OF staff.directors DO 'directors meeting' DURING blocks.rest_hour"
hints = ["The directors are a category: staff.directors.", "A set needs a word in front saying how it is taken. For everyone, that's ALL_OF."]
explain = "ALL_OF staff.directors means David, Lisa and Matthew, every one of them, together — met only if all three do it."
alternatives = [
  "REQUEST ALL_OF {staff.david + staff.lisa + staff.matthew} DO 'directors meeting' DURING blocks.rest_hour",
]
wrong = [
  "REQUEST ANY 1 staff.directors DO 'directors meeting' DURING blocks.rest_hour",
  "REQUEST ALL_OF {staff.david + staff.lisa} DO 'directors meeting' DURING blocks.rest_hour",
]

[[problem]]
id = "together-rob-vic"
title = "A pair"
prompt = "Rob and Vic do a 'ropes check' together during setup."
answer = "REQUEST ALL_OF {staff.rob + staff.vic} DO 'ropes check' DURING blocks.setup"
hints = ["Put the two names in braces with a + between them: {staff.rob + staff.vic}.", "Then say ALL_OF in front, because both of them do it."]
alternatives = ["REQUEST ALL_OF {staff.vic + staff.rob} DO 'ropes check' DURING blocks.setup"]
wrong = ["REQUEST staff.rob DO 'ropes check' DURING blocks.setup"]

[[problem]]
id = "together-eq-staff"
title = "Barn crew"
prompt = "All of the EQ staff do 'barn chores' during breakfast."
answer = "REQUEST ALL_OF staff.eq_staff DO 'barn chores' DURING blocks.breakfast"
hints = ["The equestrian staff are staff.eq_staff."]
alternatives = ["REQUEST ALL_OF {staff.hailey + staff.alexis + staff.alyce} DO 'barn chores' DURING blocks.breakfast"]
wrong = ["REQUEST ALL_OF staff.mfgs DO 'barn chores' DURING blocks.breakfast"]

[[problem]]
id = "together-mfgs"
title = "Maintenance crew"
prompt = "The MFGs all do 'trail maintenance' during clinic 3."
answer = "REQUEST ALL_OF staff.mfgs DO 'trail maintenance' DURING blocks.clinic_3"
alternatives = ["REQUEST ALL_OF {staff.alan + staff.charlton + staff.connor} DO 'trail maintenance' DURING blocks.clinic_3"]
wrong = ["REQUEST ALL_OF {staff.alan + staff.charlton} DO 'trail maintenance' DURING blocks.clinic_3"]

[[problem]]
id = "together-village-leaders"
