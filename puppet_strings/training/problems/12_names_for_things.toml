[level]
name = "Bindings and Mappings"
blurb = "Binding lines name a choice so several statements share it; mappings look values up."
day = "2026-08-04"
teaches = """
EACH x IN <set>      on its own line: one copy of the request per item, called x
ANY 1 x IN <set>     on its own line: one choice, the same everywhere x appears

ANY 1 p IN staff.counselors
REQUEST p DO 'campfire setup' DURING blocks.clinic_4
REQUEST p DO 'campfire teardown' DURING blocks.evening_program

EACH c IN staff.counselors
REQUEST mappings.buddy(c) DO 'cabin cover' DURING blocks.dinner

• ALL {staff.alesa + v} adds a chosen name into a set
• ALL {staff.mfgs - m} is everyone the choice left out: forbid them with NOT DO
• A pick inside one statement is already shared by it; a binding line shares
  a pick between statements
• mappings.buddy(c) is whatever the Mappings tab gives for c
"""

[[problem]]
id = "names-same-person"
title = "The same person, twice"
prompt = "One counselor — the same one — does 'campfire setup' during clinic 4 and 'campfire teardown' during the evening program."
answer = "ANY 1 p IN staff.counselors\nREQUEST p DO 'campfire setup' DURING blocks.clinic_4\nREQUEST p DO 'campfire teardown' DURING blocks.evening_program"
hints = ["A line ANY 1 p IN staff.counselors makes one choice and calls it p.", "Then use p as the subject of both REQUEST lines."]
explain = "Two separate picks could be two different counselors. A named choice is made once."
wrong = [
  "REQUEST ANY 1 staff.counselors DO 'campfire setup' DURING blocks.clinic_4\nREQUEST ANY 1 staff.counselors DO 'campfire teardown' DURING blocks.evening_program",
]

[[problem]]
id = "names-each-person-line"
title = "A line per person"
prompt = "Using a binding line: each director gets 'desk time' during rest hour, each on their own."
answer = "EACH d IN staff.directors\nREQUEST d DO 'desk time' DURING blocks.rest_hour"
priority = "MEDIUM"
alternatives = ["REQUEST EACH staff.directors DO 'desk time' DURING blocks.rest_hour"]
wrong = ["REQUEST ALL staff.directors DO 'desk time' DURING blocks.rest_hour"]

[[problem]]
id = "names-buddy-cover"
title = "Buddies cover dinner"
prompt = "Each counselor's buddy (from mappings.buddy) does 'cabin cover' during dinner."
answer = "EACH c IN staff.counselors\nREQUEST mappings.buddy(c) DO 'cabin cover' DURING blocks.dinner"
priority = "HIGH"
hints = ["mappings.buddy(c) gives c's buddy.", "Name each counselor first: EACH c IN staff.counselors."]
explain = "A counselor with no buddy on the Mappings tab gets the mapping's default: one of the non-counselors, non-directors."
wrong = ["EACH c IN staff.counselors\nREQUEST mappings.buddy(c) DO 'cabin cover' DURING blocks.lunch"]

[[problem]]
id = "names-one-buddy"
title = "Dylan's buddy"
prompt = "Dylan's buddy covers his cabin — 'cabin cover' — during embers. Look the buddy up rather than naming them."
answer = "REQUEST mappings.buddy(staff.dylan) DO 'cabin cover' DURING blocks.embers"
explain = "The Mappings tab says Dylan's buddy is Kara, so this is the same as asking Kara — until the tab changes."
alternatives = ["REQUEST staff.kara DO 'cabin cover' DURING blocks.embers"]
wrong = ["REQUEST mappings.buddy(staff.robyn) DO 'cabin cover' DURING blocks.embers"]

[[problem]]
id = "names-videographer"
title = "Alesa and one of two"
prompt = "Alesa, plus either Dylan or Cam VL, do a 'video shoot' together in one block today."
answer = "ANY 1 v IN {staff.dylan + staff.cam_vl}\nREQUEST ALL {staff.alesa + v} DO 'video shoot' DURING ANY 1 blocks"
hints = ["Name the choice: ANY 1 v IN {staff.dylan + staff.cam_vl}.", "Then add it into a set: ALL {staff.alesa + v}."]
explain = "Written in place, ALL {staff.alesa + ANY 1 {staff.dylan + staff.cam_vl}} says the same. The one not picked is not ruled out."
alternatives = ["REQUEST ALL {staff.alesa + ANY 1 {staff.dylan + staff.cam_vl}} DO 'video shoot' DURING ANY 1 blocks"]
wrong = ["REQUEST ALL {staff.alesa + staff.dylan} DO 'video shoot' DURING ANY 1 blocks"]

[[problem]]
id = "names-the-rest-stay-off"
title = "One, and nobody else"
prompt = "One of the MFGs — the solver's pick — does 'trail check' during clinic 2, and the other MFGs don't do it at all today."
answer = "ANY 1 m IN staff.mfgs\nREQUEST m DO 'trail check' DURING blocks.clinic_2\nREQUEST ALL {staff.mfgs - m} NOT DO 'trail check'"
hints = ["Name the pick with a binding line.", "Everyone it left out is {staff.mfgs - m}; keep them off with NOT DO."]
explain = "ANY 1 picks and never forbids, so on its own the other MFGs could still check trails. Taking the pick out of the set leaves the rest, whoever the pick turns out to be. A cap says the same: REQUEST AT_MOST 1 staff.mfgs DO 'trail check'."
alternatives = ["REQUEST ANY 1 staff.mfgs DO 'trail check' DURING blocks.clinic_2\nREQUEST AT_MOST 1 staff.mfgs DO 'trail check'"]
wrong = ["ANY 1 m IN staff.mfgs\nREQUEST m DO 'trail check' DURING blocks.clinic_2"]

[[problem]]
id = "names-free-after-clinic"
title = "A person and their day"
prompt = "Each counselor who runs a clinic in clinic 1 should be free in clinic 2. Name each counselor with a binding line, and use IF."
answer = "EACH s IN staff.counselors\nIF s DO ANY activities.clinics DURING blocks.clinic_1\nREQUEST s FREE DURING blocks.clinic_2"
priority = "HIGH"
wrong = ["EACH s IN staff.counselors\nREQUEST s FREE DURING blocks.clinic_2"]

[[problem]]
id = "names-pair-of-mfgs"
title = "A pair, twice"
prompt = "The same two MFGs do 'woodchopping' during clinic 1 and 'woodstacking' during clinic 2."
answer = "ANY 2 m IN staff.mfgs\nREQUEST ALL m DO 'woodchopping' DURING blocks.clinic_1\nREQUEST ALL m DO 'woodstacking' DURING blocks.clinic_2"
wrong = ["REQUEST ANY 2 staff.mfgs DO 'woodchopping' DURING blocks.clinic_1\nREQUEST ANY 2 staff.mfgs DO 'woodstacking' DURING blocks.clinic_2"]

[[problem]]
id = "names-buddy-free"
title = "Buddies stay free"
prompt = "Each counselor's buddy is free during embers, so they can cover if needed."
answer = "EACH c IN staff.counselors\nREQUEST mappings.buddy(c) FREE DURING blocks.embers"
priority = "LOW"
wrong = ["EACH c IN staff.counselors\nREQUEST c FREE DURING blocks.embers"]

[[problem]]
id = "names-director-and-buddy"
title = "Not the buddy"
prompt = "Robyn's buddy doesn't do 'lifeguard' during rest hour."
answer = "REQUEST mappings.buddy(staff.robyn) NOT DO 'lifeguard' DURING blocks.rest_hour"
alternatives = ["REQUEST staff.paul NOT DO 'lifeguard' DURING blocks.rest_hour"]
wrong = ["REQUEST staff.robyn NOT DO 'lifeguard' DURING blocks.rest_hour"]

[[problem]]
id = "names-office-minus-buddy"
title = "Everyone but the buddy"
prompt = "Every director stays off 'cabin cover' at dinner, but James's buddy is the one who does it."
answer = "REQUEST mappings.buddy(staff.james) DO 'cabin cover' DURING blocks.dinner\nREQUEST ALL staff.directors NOT DO 'cabin cover' DURING blocks.dinner"
alternatives = ["REQUEST staff.julian DO 'cabin cover' DURING blocks.dinner\nREQUEST ALL staff.directors NOT DO 'cabin cover' DURING blocks.dinner"]
wrong = ["REQUEST mappings.buddy(staff.james) DO 'cabin cover' DURING blocks.dinner"]

[[problem]]
id = "names-each-with-two-statements"
title = "Each gets both"
prompt = "Each village leader does 'cabin check' during embers and is free during the evening program. The two go together for each leader."
answer = "EACH v IN staff.village_leaders\nREQUEST v DO 'cabin check' DURING blocks.embers\nREQUEST v FREE DURING blocks.evening_program"
priority = "MEDIUM"
wrong = ["EACH v IN staff.village_leaders\nREQUEST v DO 'cabin check' DURING blocks.embers"]

[[problem]]
id = "names-one-hero-all-meals"
title = "One hero, every meal"
prompt = "One village hero — the same one all day — does 'allergy table' at every meal."
answer = "REQUEST ANY 1 staff.village_heroes DO 'allergy table' DURING ALL blocks.meals"
explain = "ANY 1 picks one hero for the whole statement, so the one picked does all three — no binding line needed."
alternatives = ["ANY 1 h IN staff.village_heroes\nREQUEST h DO 'allergy table' DURING ALL blocks.meals"]
wrong = ["REQUEST ANY 1 staff.village_heroes DO 'allergy table' DURING EACH blocks.meals"]

[[problem]]
id = "names-two-in-one-block"
title = "A pair, one block"
prompt = "Two of the EQ staff do 'hoof trimming' together, in one of the morning clinic blocks (clinic 1 or clinic 2)."
answer = "REQUEST ANY 2 staff.eq_staff DO 'hoof trimming' DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}"
hints = ["A pick is made once for the statement, and everything in it shares it."]
explain = "The block is picked once, so the two EQ staff share it. A binding line says the same, ANY 1 b IN {…} and DURING b, and is what to reach for when the block is used in more than one statement. ANY with no number would let each of them trim in either block."
alternatives = ["ANY 1 b IN {blocks.clinic_1 + blocks.clinic_2}\nREQUEST ANY 2 staff.eq_staff DO 'hoof trimming' DURING b"]
wrong = ["REQUEST ANY 2 staff.eq_staff DO 'hoof trimming' DURING ANY {blocks.clinic_1 + blocks.clinic_2}"]


[[problem]]
id = "names-a-task"
title = "One name for the job"
prompt = "Name the task 'director on duty' once, as duty, and use it twice: one director does it during clinic 1, and Lisa does it during clinic 3."
answer = "duty: 'director on duty'\nREQUEST ANY 1 staff.directors DO duty DURING blocks.clinic_1\nREQUEST staff.lisa DO duty DURING blocks.clinic_3"
hints = ["A quoted task can be named like a set: duty: 'director on duty'.", "The name goes after DO."]
explain = "A named task is written once, so the lines using it can't drift apart with a typo."
alternatives = ["REQUEST ANY 1 staff.directors DO 'director on duty' DURING blocks.clinic_1\nREQUEST staff.lisa DO 'director on duty' DURING blocks.clinic_3"]
wrong = ["duty: 'director on duty'\nREQUEST ANY 1 staff.directors DO duty DURING blocks.clinic_1\nREQUEST staff.lisa DO duty DURING blocks.clinic_4"]
