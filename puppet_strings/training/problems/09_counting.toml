[level]
name = "Picking, capping and lengths"
blurb = "ANY n to pick, AT_MOST to cap, and FOR for how long."
day = "2026-08-04"
teaches = """
ANY n <set>                    the solver picks n — what a REQUEST asks for
AT_MOST n <set>                a cap: no more than n
AT_LEAST n, EXACTLY n          measure, in an IF, a PREFER, FOR and WITH
FOR AT_LEAST|AT_MOST|EXACTLY <time>   how long

REQUEST AT_MOST 2 staff.counselors DO 'break' DURING EACH blocks.all
REQUEST EACH staff.village_heroes DO 'break' DURING ANY 3 blocks.all
REQUEST EACH staff.all DO ANY activities.clinics.all DURING AT_MOST 1 CONSECUTIVE blocks.all
REQUEST staff.cam_vl DO 'video editing' FOR AT_LEAST 2h DURING ANY blocks.all

• ANY n picks and never forbids; AT_MOST forbids the rest
• A REQUEST picks with ANY n: it refuses AT_LEAST n, and EXACTLY n
• "Exactly n" is a pick and a cap: ANY n in one statement, AT_MOST n in another
• A pick is made once for the statement; EACH makes copies that pick for themselves
• A block is a block on a date: over ANY dates, blocks are counted on every day
• A pick of activities is of different ones; three breaks is a pick of blocks
• FOR in blocks taken one at a time is each piece; over ANY blocks it is the total
• ANY CONSECUTIVE: the total of one run of back-to-back blocks
"""

[[problem]]
id = "count-two-on-break"
title = "Two at a time"
prompt = "Never more than two counselors on 'break' in the same block."
answer = "REQUEST AT_MOST 2 staff.counselors DO 'break' DURING EACH blocks.all"
priority = "MUST_HAPPEN"
hints = ["The count is of counselors: AT_MOST 2 staff.counselors.", "EACH blocks.all makes it count block by block rather than over the whole day."]
explain = "Without EACH on the blocks, it would be at most two counselors with a break at all today."
wrong = [
  "REQUEST AT_MOST 3 staff.counselors DO 'break' DURING EACH blocks.all",
  "REQUEST AT_MOST 2 staff.counselors DO 'break' DURING ANY blocks.all",
]

[[problem]]
id = "count-lifeguards"
title = "Enough lifeguards"
prompt = "At least three village heroes do 'lifeguard' during rest hour."
answer = "REQUEST ANY 3 staff.village_heroes DO 'lifeguard' DURING blocks.rest_hour"
explain = "ANY 3 picks three to do it; it never keeps a fourth away."
wrong = ["REQUEST ANY 2 staff.village_heroes DO 'lifeguard' DURING blocks.rest_hour"]

[[problem]]
id = "count-exactly-one-on-call"
title = "Exactly one on call"
prompt = "Exactly one director is 'on call' during embers: one of them, and no second."
answer = "REQUEST ANY 1 staff.directors DO 'on call' DURING blocks.embers\nREQUEST AT_MOST 1 staff.directors DO 'on call' DURING blocks.embers"
priority = "MUST_HAPPEN"
hints = ["Exactly is two things: one picked, and no more than one.", "Write two statements in one request: ANY 1 to pick, AT_MOST 1 to cap."]
explain = "ANY 1 picks one and forbids nothing, so a second director could still be put on call. AT_MOST 1 is the cap that keeps the rest off. A REQUEST refuses EXACTLY 1, so that the forbidding is written where it can be seen."
alternatives = ["REQUEST AT_MOST 1 staff.directors DO 'on call' DURING blocks.embers\nREQUEST ANY 1 staff.directors DO 'on call' DURING blocks.embers"]
wrong = [
  "REQUEST ANY 1 staff.directors DO 'on call' DURING blocks.embers",
  "REQUEST AT_MOST 1 staff.directors DO 'on call' DURING blocks.embers",
]

[[problem]]
id = "count-exactly-one-rakes"
title = "One of the two"
prompt = "Exactly one of Dylan and Alesa rakes leaves ('rake leaves') today, whenever. The other one doesn't."
answer = "REQUEST ANY 1 {staff.dylan + staff.alesa} DO 'rake leaves' DURING ANY blocks.all\nREQUEST AT_MOST 1 {staff.dylan + staff.alesa} DO 'rake leaves' DURING ANY blocks.all"
hints = ["Pick one of the two, and cap the two of them at one."]
explain = "The cap counts its own set and nobody else: anyone else may still rake, if something asks them to. ANY 1 alone would let both of them. Naming the pick and forbidding the other says the same: ANY 1 r IN {…}, then REQUEST ALL {(staff.dylan + staff.alesa) - r} NOT DO 'rake leaves'."
alternatives = [
  "REQUEST ANY 1 {staff.dylan + staff.alesa} DO 'rake leaves'\nREQUEST AT_MOST 1 {staff.dylan + staff.alesa} DO 'rake leaves'",
  "ANY 1 r IN {staff.dylan + staff.alesa}\nREQUEST r DO 'rake leaves' DURING ANY blocks.all\nREQUEST ALL {(staff.dylan + staff.alesa) - r} NOT DO 'rake leaves'",
]
wrong = ["REQUEST ANY 1 {staff.dylan + staff.alesa} DO 'rake leaves' DURING ANY blocks.all"]

[[problem]]
id = "count-short-break"
title = "A short break"
prompt = "Rob takes a 30-minute 'break' during clinic 1."
answer = "REQUEST staff.rob DO 'break' FOR EXACTLY 30m DURING blocks.clinic_1"
hints = ["FOR EXACTLY 30m goes after the task."]
explain = "A task with FOR takes part of its block; the Staff View labels the rest of it."
alternatives = ["REQUEST staff.rob DO 'break' DURING blocks.clinic_1 FOR EXACTLY 30m"]
wrong = ["REQUEST staff.rob DO 'break' DURING blocks.clinic_1"]

[[problem]]
id = "count-three-short-breaks"
title = "Three half hours"
prompt = "Kara takes three 30-minute 'break's today, each in a different block."
answer = "REQUEST staff.kara DO 'break' FOR EXACTLY 30m DURING ANY 3 blocks.all"
hints = ["Pick the blocks; FOR is the length of each piece."]
explain = "The blocks are taken one at a time here, picked, so FOR is the length of the piece in each of them."
wrong = ["REQUEST staff.kara DO 'break' FOR EXACTLY 30m DURING ANY blocks.all"]

[[problem]]
id = "count-two-hours-editing"
title = "Two hours of editing"
prompt = "Cam VL spends at least two hours on 'video editing' today, in whatever blocks."
answer = "REQUEST staff.cam_vl DO 'video editing' FOR AT_LEAST 2h DURING ANY blocks.all"
hints = ["A length is written 2h or 120m, and goes on FOR.", "Over ANY blocks, FOR is the total."]
explain = "Pooled with ANY, the blocks are one unit, so FOR adds up the pieces. They fill their blocks, all but one, which is cut to what is left."
alternatives = [
  "REQUEST staff.cam_vl DO 'video editing' FOR AT_LEAST 120m DURING ANY blocks.all",
  "REQUEST staff.cam_vl DO 'video editing' FOR AT_LEAST 2h",
]
wrong = ["REQUEST staff.cam_vl DO 'video editing' FOR AT_LEAST 1h DURING ANY blocks.all"]

[[problem]]
id = "count-two-hours-unbroken"
title = "Two hours in one go"
prompt = "Cam VL spends at least two hours on 'video editing' today, all in one go: one block, or blocks back to back."
answer = "REQUEST staff.cam_vl DO 'video editing' FOR AT_LEAST 2h DURING ANY CONSECUTIVE blocks.all"
hints = ["Start from the last problem's answer.", "DURING ANY CONSECUTIVE blocks.all measures the length run by run instead of over the whole day."]
explain = "Without CONSECUTIVE, two hours can be split across blocks hours apart. With it, one run of back-to-back blocks has to reach two hours. No block today is that long, so the run takes at least two."
alternatives = ["REQUEST staff.cam_vl DO 'video editing' DURING ANY CONSECUTIVE blocks.all FOR AT_LEAST 2h"]
wrong = ["REQUEST staff.cam_vl DO 'video editing' FOR AT_LEAST 2h DURING ANY blocks.all"]

[[problem]]
id = "count-one-sitting"
title = "One sitting"
prompt = "Hails does 45 minutes of 'lesson planning' today in one sitting, in whichever block."
answer = "REQUEST staff.hails DO 'lesson planning' FOR EXACTLY 45m DURING ANY 1 blocks.all"
hints = ["FOR sets the length of one piece when the blocks are taken one at a time.", "ANY 1 blocks.all is one block, the solver's pick."]
explain = "Over ANY blocks, 45 minutes would be a total that could be made of pieces at different times. Picked, each block is its own unit, so FOR EXACTLY 45m is one piece in one block."
wrong = ["REQUEST staff.hails DO 'lesson planning' FOR EXACTLY 45m DURING ANY blocks.all"]

[[problem]]
id = "count-no-two-in-a-row"
title = "Never two in a row"
prompt = "Nobody runs two clinics back to back. Count it per person."
answer = "REQUEST EACH staff.all DO ANY activities.clinics.all DURING AT_MOST 1 CONSECUTIVE blocks.all"
priority = "MUST_HAPPEN"
hints = ["EACH staff.all counts person by person.", "What is counted is blocks in a row: DURING AT_MOST 1 CONSECUTIVE blocks.all.", "Which clinic doesn't matter: ANY activities.clinics.all."]
explain = "ANY on the clinics says which blocks count — ones with any clinic in them. The cap is on the blocks."
wrong = ["REQUEST EACH staff.all DO ANY activities.clinics.all DURING AT_MOST 2 CONSECUTIVE blocks.all"]

[[problem]]
id = "count-each-at-most-two-clinics"
