prompt = "Each counselor is free for at least one of the four clinic blocks today."
answer = "REQUEST EACH staff.counselors FREE DURING ANY 1 blocks.all_clinics"
priority = "HIGH"
alternatives = ["REQUEST EACH staff.counselors FREE DURING ANY blocks.all_clinics"]
wrong = ["REQUEST EACH staff.counselors FREE DURING ANY 2 blocks.all_clinics"]

[[problem]]
id = "count-hour-of-kitchen"
