prompt = "No counselor runs clinics in more than two blocks today."
answer = "REQUEST EACH staff.counselors DO ANY activities.clinics.all DURING AT_MOST 2 blocks.all"
priority = "HIGH"
hints = ["A clinic block is counted as a block: DURING AT_MOST 2 blocks.all."]
wrong = [
  "REQUEST AT_MOST 2 staff.counselors DO ANY activities.clinics.all",
  "REQUEST EACH staff.counselors DO ANY activities.clinics.all DURING AT_MOST 3 blocks.all",
]

[[problem]]
id = "count-different-clinics"
title = "Two different clinics"
prompt = "Tyson runs at least two different clinics today — running the same one twice doesn't count."
answer = "REQUEST staff.tyson DO ANY 2 activities.clinics.all"
hints = ["Pick the clinics themselves: DO ANY 2 activities.clinics.all."]
explain = "A pick of activities is of different ones. Picking blocks instead would let the same clinic twice pass."
wrong = ["REQUEST staff.tyson DO ANY activities.clinics.all DURING ANY 2 blocks.all"]

[[problem]]
id = "count-break-each"
title = "Three breaks each"
prompt = "Every village hero gets a 'break' in three blocks today, each hero counted on their own."
answer = "REQUEST EACH staff.village_heroes DO 'break' DURING ANY 3 blocks.all"
priority = "HIGH"
hints = ["A break is not counted; the blocks it is in are picked.", "EACH makes a copy per hero, and each copy picks its own three."]
wrong = ["REQUEST ANY 3 staff.village_heroes DO 'break' DURING ANY blocks.all"]

[[problem]]
id = "count-two-counselors-two-blocks"
title = "One pick for the statement"
prompt = "Two counselors do 'bunk check' together, in the same two clinic blocks."
answer = "REQUEST ANY 2 staff.counselors DO 'bunk check' DURING ANY 2 blocks.all_clinics"
hints = ["One pick for the people, one for the blocks."]
explain = "Each pick is made once for the statement, so the two counselors share the two blocks the solver picks. EACH staff.counselors in front would give every counselor two blocks of their own."
wrong = ["REQUEST ANY 2 staff.counselors DO 'bunk check' DURING ANY 1 blocks.all_clinics"]

[[problem]]
id = "count-three-breaks-for"
title = "Three short breaks"
prompt = "Each non-director, non-counselor staff member takes three 30-minute 'break's today, in three different blocks."
answer = "REQUEST EACH {staff.all - staff.directors - staff.counselors} DO 'break' FOR EXACTLY 30m DURING ANY 3 blocks.all"
priority = "MUST_HAPPEN"
alternatives = ["REQUEST EACH {staff.all - (staff.directors + staff.counselors)} DO 'break' FOR EXACTLY 30m DURING ANY 3 blocks.all"]
wrong = ["REQUEST EACH {staff.all - staff.directors - staff.counselors} DO 'break' DURING ANY 3 blocks.all"]

[[problem]]
id = "count-at-most-one-archery"
title = "Once is enough"
prompt = "Tyson runs Archery 1 & 2 at most once today."
answer = "REQUEST staff.tyson DO activities.clinics.archery_1_2 DURING AT_MOST 1 blocks.all"
wrong = ["REQUEST staff.tyson DO activities.clinics.archery_1_2 DURING AT_MOST 2 blocks.all"]

[[problem]]
id = "count-at-least-one-free-clinic"
