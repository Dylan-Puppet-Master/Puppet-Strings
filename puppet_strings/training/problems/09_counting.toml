prompt = "Between them, the MFGs spend at least an hour on 'kitchen repair' today."
answer = "REQUEST ANY staff.mfgs DO 'kitchen repair' FOR AT_LEAST 1h"
hints = ["Pool the MFGs with ANY, and FOR adds up what they do."]
explain = "Pooled people add up the same way pooled blocks do. EACH would ask an hour of every one of them."
alternatives = ["REQUEST ANY staff.mfgs DO 'kitchen repair' FOR AT_LEAST 60m DURING ANY blocks.all"]
wrong = ["REQUEST EACH staff.mfgs DO 'kitchen repair' FOR AT_LEAST 1h"]

[[problem]]
id = "count-at-most-one-in-office"
title = "Not a crowd"
