answer = "REQUEST staff.dylan DO 'archery maintenance' FOR AT_LEAST 1.5h"
alternatives = ["REQUEST staff.dylan DO 'archery maintenance' FOR AT_LEAST 90m"]
wrong = ["REQUEST staff.dylan DO 'archery maintenance' FOR AT_LEAST 1h"]

[[problem]]
id = "count-no-more-than-four-busy"
title = "Room to breathe"
prompt = "Each director has at most four blocks with anything assigned today."
answer = "REQUEST EACH staff.directors BUSY DURING AT_MOST 4 blocks.all"
priority = "HIGH"
wrong = ["REQUEST AT_MOST 4 staff.directors BUSY DURING ANY blocks.all"]


[[problem]]
id = "count-clinics-a-session"
title = "Three a session"
prompt = "Dylan is new to facilitating: over the whole session, he is first (roles.first) on at most three clinics."
answer = "REQUEST staff.dylan DO ANY activities.clinics.all AS_ROLE roles.first DURING AT_MOST 3 blocks.all ON ANY dates.session_6.all"
hints = ["Count the blocks he facilitates in.", "Over ANY dates of the session, each block of each day counts."]
explain = "Clinic 1 on Monday and clinic 1 on Tuesday are two blocks, so a count of blocks over dates pooled with ANY is a number of times across the session. blocks.all_clinics says the same, since clinics only run in clinic blocks. ON ALL would count only the blocks he is first in on every day of the session, which asks almost nothing."
alternatives = [
  "REQUEST staff.dylan DO ANY activities.clinics.all AS_ROLE roles.first DURING AT_MOST 3 blocks.all_clinics ON ANY dates.session_target.all",
]
wrong = [
  "REQUEST staff.dylan DO ANY activities.clinics.all AS_ROLE roles.first DURING AT_MOST 3 blocks.all ON ALL dates.session_6.all",
  "REQUEST staff.dylan DO ANY activities.clinics.all AS_ROLE roles.first DURING AT_MOST 3 blocks.all",
]

[[problem]]
id = "count-once-a-day"
title = "Once a day"
prompt = "Every day from today to Friday, Tori does 'feed the goats' in one block — any block, and each day counts on its own."
answer = "REQUEST staff.tori DO 'feed the goats' DURING ANY 1 blocks.all ON EACH {2026-08-04 .. 2026-08-07}"
priority = "HIGH"
hints = ["A request per day: ON EACH.", "In each, a pick of one block."]
explain = "ON EACH makes a request per day, so the block can differ from day to day. ON ALL would make the days one unit: one block, picked once, the same every day. ON ANY would pick over all the days together: once in the whole week."
alternatives = ["REQUEST staff.tori DO 'feed the goats' DURING ANY blocks.all ON EACH {2026-08-04 .. 2026-08-07}"]
wrong = [
  "REQUEST staff.tori DO 'feed the goats' DURING ANY 1 blocks.all ON ANY {2026-08-04 .. 2026-08-07}",
  "REQUEST staff.tori DO 'feed the goats' DURING ANY 1 blocks.all ON ALL {2026-08-04 .. 2026-08-07}",
]

[[problem]]
id = "count-once-a-week"
title = "Once, some day"
prompt = "Between today and Friday, Tori does 'hay delivery' once, and no more — one block on one day."
answer = "REQUEST staff.tori DO 'hay delivery' DURING ANY 1 blocks.all ON ANY {2026-08-04 .. 2026-08-07}\nREQUEST staff.tori DO 'hay delivery' DURING AT_MOST 1 blocks.all ON ANY {2026-08-04 .. 2026-08-07}"
hints = ["Pool the days with ANY, and pick one block across all of them.", "No more is a cap: AT_MOST 1, over the same days."]
explain = "Over dates pooled with ANY, the blocks are every block of every day, so ANY 1 is once in the four days and AT_MOST 1 keeps it to once."
wrong = [
  "REQUEST staff.tori DO 'hay delivery' DURING ANY 1 blocks.all ON ANY {2026-08-04 .. 2026-08-07}",
  "REQUEST staff.tori DO 'hay delivery' DURING ANY 1 blocks.all ON EACH {2026-08-04 .. 2026-08-07}",
]

