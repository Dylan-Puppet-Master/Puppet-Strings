[level]
name = "Dates"
blurb = "ON, date names, ranges and offsets."
day = "2026-08-04"
teaches = """
ON <dates>

ON 2026-08-05                                one date, written out
ON ALL {2026-08-03 .. 2026-08-05}            a run of dates, inclusive
ON EACH {dates.session_6 & dates.mondays}    every Monday of the session
ON EACH {dates.session_6 & dates.weekdays}   every weekday of the session
ON {dates.target + 1d}                       the day after the one being scheduled

• dates.target is the day being scheduled; no ON means dates.target
• dates.mondays … dates.sundays, dates.weekdays and dates.weekends are the whole season's;
  & with a session or a week keeps the ones in it
• Weekends (Sat, Sun) only run meals and rest hour
"""

[[problem]]
id = "dates-tomorrow"
title = "Tomorrow"
prompt = "Tomorrow — the day after the one being scheduled — Rob does 'ropes audit' during clinic 1."
answer = "REQUEST staff.rob DO 'ropes audit' DURING blocks.clinic_1 ON {dates.target + 1d}"
hints = ["You can add days to a date inside braces: {dates.target + 1d}."]
explain = "An offset follows the day being scheduled, so this request means 'tomorrow' whichever day you open it on."
alternatives = ["REQUEST staff.rob DO 'ropes audit' DURING blocks.clinic_1 ON 2026-08-05"]
wrong = ["REQUEST staff.rob DO 'ropes audit' DURING blocks.clinic_1 ON {dates.target - 1d}"]

[[problem]]
id = "dates-thursday-name"
title = "Thursday, by name"
prompt = "On Thursday of this session, Alyce does 'saddle soaping' during clinic 2. Use date names rather than writing the date out."
answer = "REQUEST staff.alyce DO 'saddle soaping' DURING blocks.clinic_2 ON EACH {dates.session_6 & dates.thursdays}"
hints = ["The Thursdays of session six are the ones in both: {dates.session_6 & dates.thursdays}.", "A set of dates takes a quantifier, even one holding a single date: ON EACH {...}."]
alternatives = [
  "REQUEST staff.alyce DO 'saddle soaping' DURING blocks.clinic_2 ON 2026-08-06",
  "REQUEST staff.alyce DO 'saddle soaping' DURING blocks.clinic_2 ON EACH {dates.thursdays & dates.session_6}",
  "REQUEST staff.alyce DO 'saddle soaping' DURING blocks.clinic_2 ON EACH {dates.session_6.week_1 & dates.thursdays}",
]
wrong = ["REQUEST staff.alyce DO 'saddle soaping' DURING blocks.clinic_2 ON EACH {dates.session_6 & dates.tuesdays}"]

[[problem]]
id = "dates-range-all"
title = "Three days running"
day = "2026-08-03"
prompt = "Kara does 'costume sorting' during rest hour on Monday, Tuesday and Wednesday — all three."
answer = "REQUEST staff.kara DO 'costume sorting' DURING blocks.rest_hour ON ALL {2026-08-03 .. 2026-08-05}"
hints = ["{2026-08-03 .. 2026-08-05} is the three days, first and last included."]
alternatives = [
  "REQUEST staff.kara DO 'costume sorting' DURING blocks.rest_hour ON ALL {2026-08-03 + 2026-08-04 + 2026-08-05}",
  "REQUEST staff.kara DO 'costume sorting' DURING blocks.rest_hour ON ALL {dates.session_6 & {dates.mondays + dates.tuesdays + dates.wednesdays}}",
]
wrong = ["REQUEST staff.kara DO 'costume sorting' DURING blocks.rest_hour ON ALL {2026-08-03 .. 2026-08-06}"]

[[problem]]
id = "dates-mondays"
title = "Every Monday"
prompt = "On every Monday of the session, Lisa does 'week planning' during rest hour, each Monday its own request."
answer = "REQUEST staff.lisa DO 'week planning' DURING blocks.rest_hour ON EACH {dates.session_6 & dates.mondays}"
priority = "MEDIUM"
hints = ["dates.mondays is every Monday of the season; & dates.session_6 keeps the ones in session six."]
alternatives = ["REQUEST staff.lisa DO 'week planning' DURING blocks.rest_hour ON EACH {dates.mondays & dates.session_6}"]
wrong = ["REQUEST staff.lisa DO 'week planning' DURING blocks.rest_hour ON EACH {dates.session_6 & dates.fridays}"]

[[problem]]
id = "dates-whole-session"
title = "The whole session"
prompt = "Some day during this session — any day — Brian does 'village photo' during lunch."
answer = "REQUEST staff.brian DO 'village photo' DURING blocks.lunch ON ANY 1 dates.session_6"
hints = ["Every date of the session is dates.session_6."]
alternatives = ["REQUEST staff.brian DO 'village photo' DURING blocks.lunch ON ANY 1 {2026-08-02 .. 2026-08-08}"]
wrong = ["REQUEST staff.brian DO 'village photo' DURING blocks.lunch ON ANY 1 {dates.session_6 - dates.sundays}"]

[[problem]]
id = "dates-day-before-friday"
title = "The day before"
prompt = "Rob does 'incident review' during rest hour on the day before the session's Friday, 2026-08-07. Write it as Friday minus one day."
answer = "REQUEST staff.rob DO 'incident review' DURING blocks.rest_hour ON {2026-08-07 - 1d}"
hints = ["{2026-08-07 - 1d}"]
explain = "Offsets work on any single date, not just dates.target."
alternatives = ["REQUEST staff.rob DO 'incident review' DURING blocks.rest_hour ON 2026-08-06"]
wrong = ["REQUEST staff.rob DO 'incident review' DURING blocks.rest_hour ON {2026-08-07 + 1d}"]

[[problem]]
id = "dates-rest-of-week"
title = "Rest of the week"
prompt = "Some day from today through Friday, Julian does 'bow restringing' in one of the clinic blocks."
answer = "REQUEST staff.julian DO 'bow restringing' DURING ANY 1 blocks.all_clinics ON ANY 1 {dates.target .. 2026-08-07}"
alternatives = ["REQUEST staff.julian DO 'bow restringing' DURING ANY 1 blocks.all_clinics ON ANY 1 {2026-08-04 .. 2026-08-07}"]
wrong = ["REQUEST staff.julian DO 'bow restringing' DURING ANY 1 blocks.all_clinics ON ANY 1 {2026-08-04 .. 2026-08-06}"]

[[problem]]
id = "dates-first-sunday"
title = "Arrival day"
prompt = "On the session's first day, all the directors do 'arrival welcome' during lunch."
answer = "REQUEST ALL staff.directors DO 'arrival welcome' DURING blocks.lunch ON EACH {dates.session_6.week_1 & dates.sundays}"
hints = ["A session starts on a Sunday: the Sunday of its first week."]
alternatives = [
  "REQUEST ALL staff.directors DO 'arrival welcome' DURING blocks.lunch ON 2026-08-02",
  "REQUEST ALL staff.directors DO 'arrival welcome' DURING blocks.lunch ON EACH {dates.session_6 & dates.sundays}",
]
wrong = ["REQUEST ALL staff.directors DO 'arrival welcome' DURING blocks.lunch ON EACH {dates.session_6.week_1 & dates.saturdays}"]

[[problem]]
id = "dates-two-days"
title = "Tuesday and Thursday"
prompt = "Hailey does 'farrier visit' during clinic 1 on both Tuesday and Thursday."
answer = "REQUEST staff.hailey DO 'farrier visit' DURING blocks.clinic_1 ON ALL {2026-08-04 + 2026-08-06}"
alternatives = ["REQUEST staff.hailey DO 'farrier visit' DURING blocks.clinic_1 ON ALL {dates.session_6 & {dates.tuesdays + dates.thursdays}}"]
wrong = ["REQUEST staff.hailey DO 'farrier visit' DURING blocks.clinic_1 ON ALL {2026-08-04 .. 2026-08-06}"]

[[problem]]
id = "dates-two-days-later"
title = "Two days on"
prompt = "Two days after the day being scheduled, Connor does 'water tower check' during setup."
answer = "REQUEST staff.connor DO 'water tower check' DURING blocks.setup ON {dates.target + 2d}"
alternatives = ["REQUEST staff.connor DO 'water tower check' DURING blocks.setup ON 2026-08-06"]
wrong = ["REQUEST staff.connor DO 'water tower check' DURING blocks.setup ON {dates.target + 1d}"]

[[problem]]
id = "dates-each-weekday"
title = "Every weekday, by name"
prompt = "Each weekday of the session (Monday to Friday), Tyson does 'paintball inventory' during setup. Each day on its own."
answer = "REQUEST staff.tyson DO 'paintball inventory' DURING blocks.setup ON EACH {dates.session_6 & dates.weekdays}"
priority = "MEDIUM"
alternatives = ["REQUEST staff.tyson DO 'paintball inventory' DURING blocks.setup ON EACH {2026-08-03 .. 2026-08-07}"]
wrong = ["REQUEST staff.tyson DO 'paintball inventory' DURING blocks.setup ON EACH {2026-08-03 .. 2026-08-08}"]

[[problem]]
id = "dates-weekend"
title = "The weekends"
prompt = "On both weekend days of the session (the first Sunday and the last Saturday), Lisa does 'parent calls' during lunch — each day its own request."
answer = "REQUEST staff.lisa DO 'parent calls' DURING blocks.lunch ON EACH {dates.session_6 & dates.weekends}"
priority = "MEDIUM"
alternatives = [
  "REQUEST staff.lisa DO 'parent calls' DURING blocks.lunch ON EACH {2026-08-02 + 2026-08-08}",
  "REQUEST staff.lisa DO 'parent calls' DURING blocks.lunch ON EACH {dates.session_6 & {dates.sundays + dates.saturdays}}",
]
wrong = ["REQUEST staff.lisa DO 'parent calls' DURING blocks.lunch ON EACH {2026-08-02 + 2026-08-07}"]

[[problem]]
id = "dates-any-two-days"
title = "Two of the days"
prompt = "On two days between Monday and Friday — whichever two — Gabe does 'archery range mowing' during clinic 4."
answer = "REQUEST staff.gabe DO 'archery range mowing' DURING blocks.clinic_4 ON ANY 2 {2026-08-03 .. 2026-08-07}"
wrong = ["REQUEST staff.gabe DO 'archery range mowing' DURING blocks.clinic_4 ON ANY 1 {2026-08-03 .. 2026-08-07}"]

[[problem]]
id = "dates-week-all"
title = "All week"
prompt = "Some day in the session's first week, all of the MFGs do 'dock repair' together during clinic 3."
answer = "REQUEST ALL staff.mfgs DO 'dock repair' DURING blocks.clinic_3 ON ANY 1 dates.session_6.week_1"
alternatives = ["REQUEST ALL staff.mfgs DO 'dock repair' DURING blocks.clinic_3 ON ANY 1 {2026-08-02 .. 2026-08-08}"]
wrong = ["REQUEST ALL staff.mfgs DO 'dock repair' DURING blocks.clinic_3 ON ANY 1 {2026-08-03 .. 2026-08-07}"]

[[problem]]
id = "dates-friday-evening"
title = "Friday night"
prompt = "On Friday, one of the village leaders runs 'talent show' during the evening program."
answer = "REQUEST ANY 1 staff.village_leaders DO 'talent show' DURING blocks.evening_program ON 2026-08-07"
alternatives = ["REQUEST ANY 1 staff.village_leaders DO 'talent show' DURING blocks.evening_program ON EACH {dates.session_6 & dates.fridays}"]
wrong = ["REQUEST ANY 1 staff.village_leaders DO 'talent show' DURING blocks.evening_program ON 2026-08-06"]

[[problem]]
id = "dates-around-target"
title = "Either side"
prompt = "On the day being scheduled or the day after, Ericka does 'first aid restock' during rest hour."
answer = "REQUEST staff.ericka DO 'first aid restock' DURING blocks.rest_hour ON ANY 1 {dates.target .. dates.target + 1d}"
alternatives = [
  "REQUEST staff.ericka DO 'first aid restock' DURING blocks.rest_hour ON ANY 1 {2026-08-04 + 2026-08-05}",
  "REQUEST staff.ericka DO 'first aid restock' DURING blocks.rest_hour ON ANY 1 {dates.target + dates.target + 1d}",
]
wrong = ["REQUEST staff.ericka DO 'first aid restock' DURING blocks.rest_hour ON ANY 1 {dates.target - 1d .. dates.target}"]

[[problem]]
id = "dates-last-day-meal"
title = "Last lunch"
prompt = "On the last day of the session, every director helps with 'goodbye lunch' during lunch."
answer = "REQUEST ALL staff.directors DO 'goodbye lunch' DURING blocks.lunch ON EACH {dates.session_6.week_1 & dates.saturdays}"
alternatives = ["REQUEST ALL staff.directors DO 'goodbye lunch' DURING blocks.lunch ON 2026-08-08"]
wrong = ["REQUEST ALL staff.directors DO 'goodbye lunch' DURING blocks.lunch ON EACH {dates.session_6.week_1 & dates.fridays}"]
