[level]
name = "Conditions"
blurb = "IF and UNLESS, joined with AND and OR."
day = "2026-08-04"
teaches = """
IF <test>          the request applies only when the test holds
UNLESS <test>      only when it doesn't

A test is [amount [CONSECUTIVE]] <pattern>; with no amount, one match will do.

UNLESS staff.lisa FREE DURING blocks.clinic_1
REQUEST ANY 1 staff.permanent_heroes DO 'front desk' DURING blocks.clinic_1

IF
AT_LEAST 2 staff.counselors DO 'break' DURING blocks.lunch
AND
staff.dylan FREE DURING blocks.lunch
REQUEST staff.dylan DO 'cabin cover' DURING blocks.lunch

• In a test, a set means any of it: s NOT FREE DURING {a + b} is busy in a or b
• Mixing AND with OR needs parentheses: IF (a AND b) OR c
• One IF or UNLESS per request
"""

[[problem]]
id = "if-unless-lisa"
title = "Unless Lisa's free"
prompt = "Unless Lisa is free during clinic 1, a permanent hero covers the 'front desk' then."
answer = "UNLESS staff.lisa FREE DURING blocks.clinic_1\nREQUEST ANY 1 staff.permanent_heroes DO 'front desk' DURING blocks.clinic_1"
hints = ["UNLESS goes on a line of its own, above the REQUEST."]
alternatives = ["IF staff.lisa NOT FREE DURING blocks.clinic_1\nREQUEST ANY 1 staff.permanent_heroes DO 'front desk' DURING blocks.clinic_1"]
wrong = ["IF staff.lisa FREE DURING blocks.clinic_1\nREQUEST ANY 1 staff.permanent_heroes DO 'front desk' DURING blocks.clinic_1"]

[[problem]]
id = "if-busy-then-cover"
title = "Covering for a busy director"
prompt = "If David runs any clinic during clinic 2, Lisa does 'office cover' then."
answer = "IF staff.david DO activities.clinics.all DURING blocks.clinic_2\nREQUEST staff.lisa DO 'office cover' DURING blocks.clinic_2"
wrong = ["REQUEST staff.lisa DO 'office cover' DURING blocks.clinic_2"]

[[problem]]
id = "if-two-on-break"
title = "When two are out"
prompt = "If at least two counselors are on 'break' at lunch, Dylan does 'cabin cover' at lunch."
answer = "IF AT_LEAST 2 staff.counselors DO 'break' DURING blocks.lunch\nREQUEST staff.dylan DO 'cabin cover' DURING blocks.lunch"
wrong = ["REQUEST staff.dylan DO 'cabin cover' DURING blocks.lunch"]

[[problem]]
id = "if-and"
title = "Both at once"
prompt = "If at least two counselors are on 'break' at lunch AND Dylan is free at lunch, Dylan does 'cabin cover' at lunch. Put each condition on its own line."
answer = "IF\nAT_LEAST 2 staff.counselors DO 'break' DURING blocks.lunch\nAND\nstaff.dylan FREE DURING blocks.lunch\nREQUEST staff.dylan DO 'cabin cover' DURING blocks.lunch"
hints = ["IF can end a line; so can AND. The condition carries on below."]
alternatives = ["IF AT_LEAST 2 staff.counselors DO 'break' DURING blocks.lunch AND staff.dylan FREE DURING blocks.lunch\nREQUEST staff.dylan DO 'cabin cover' DURING blocks.lunch"]
wrong = ["IF AT_LEAST 2 staff.counselors DO 'break' DURING blocks.lunch OR staff.dylan FREE DURING blocks.lunch\nREQUEST staff.dylan DO 'cabin cover' DURING blocks.lunch"]

[[problem]]
id = "if-or"
title = "Either will do"
prompt = "If Rob or Vic runs the Gravity Zip Line during clinic 2, Donny does 'zip line spotting' then."
answer = "IF staff.rob DO activities.clinics.gravity_zip_line DURING blocks.clinic_2 OR staff.vic DO activities.clinics.gravity_zip_line DURING blocks.clinic_2\nREQUEST staff.donny DO 'zip line spotting' DURING blocks.clinic_2"
alternatives = ["IF {staff.rob + staff.vic} DO activities.clinics.gravity_zip_line DURING blocks.clinic_2\nREQUEST staff.donny DO 'zip line spotting' DURING blocks.clinic_2"]
wrong = ["IF staff.rob DO activities.clinics.gravity_zip_line DURING blocks.clinic_2 AND staff.vic DO activities.clinics.gravity_zip_line DURING blocks.clinic_2\nREQUEST staff.donny DO 'zip line spotting' DURING blocks.clinic_2"]

[[problem]]
id = "if-each-after-clinics"
title = "After two in a row"
prompt = "For each village leader: if they run two clinics back to back, they get a free block somewhere today."
answer = "EACH_OF s IN staff.village_leaders\nIF AT_LEAST 2 CONSECUTIVE s DO activities.clinics.all\nREQUEST s FREE DURING ANY 1 blocks.all"
priority = "HIGH"

[[problem]]
id = "if-unless-any-director"
title = "Unless a director is free"
prompt = "Unless some director is free during clinic 3, Brian does 'front desk' during clinic 3."
answer = "UNLESS staff.directors FREE DURING blocks.clinic_3\nREQUEST staff.brian DO 'front desk' DURING blocks.clinic_3"
explain = "In a pattern a set means 'any of these', so staff.directors FREE is true when at least one of them is free."
wrong = ["UNLESS AT_LEAST 2 staff.directors FREE DURING blocks.clinic_3\nREQUEST staff.brian DO 'front desk' DURING blocks.clinic_3"]

[[problem]]
id = "if-or-unless"
title = "Neither"
prompt = "Unless Hailey or Alyce is free during clinic 1, Alexis does 'barn check' then."
answer = "UNLESS staff.hailey FREE DURING blocks.clinic_1 OR staff.alyce FREE DURING blocks.clinic_1\nREQUEST staff.alexis DO 'barn check' DURING blocks.clinic_1"
alternatives = ["UNLESS {staff.hailey + staff.alyce} FREE DURING blocks.clinic_1\nREQUEST staff.alexis DO 'barn check' DURING blocks.clinic_1"]
wrong = ["UNLESS staff.hailey FREE DURING blocks.clinic_1 AND staff.alyce FREE DURING blocks.clinic_1\nREQUEST staff.alexis DO 'barn check' DURING blocks.clinic_1"]

[[problem]]
id = "if-parentheses"
title = "Parentheses"
prompt = "If (Rob and Vic are both free during clinic 4) or Donny is free during clinic 4, then Charlton does 'ropes inspection' during clinic 4."
answer = "IF (staff.rob FREE DURING blocks.clinic_4 AND staff.vic FREE DURING blocks.clinic_4) OR staff.donny FREE DURING blocks.clinic_4\nREQUEST staff.charlton DO 'ropes inspection' DURING blocks.clinic_4"
hints = ["IF (a AND b) OR c"]
wrong = ["IF staff.rob FREE DURING blocks.clinic_4 AND (staff.vic FREE DURING blocks.clinic_4 OR staff.donny FREE DURING blocks.clinic_4)\nREQUEST staff.charlton DO 'ropes inspection' DURING blocks.clinic_4"]

[[problem]]
id = "if-many-breaks-no-more"
title = "Enough breaks already"
prompt = "Unless Kara already has a 'break' during lunch, she takes one during dinner."
answer = "UNLESS staff.kara DO 'break' DURING blocks.lunch\nREQUEST staff.kara DO 'break' DURING blocks.dinner"
wrong = ["IF staff.kara DO 'break' DURING blocks.lunch\nREQUEST staff.kara DO 'break' DURING blocks.dinner"]

[[problem]]
id = "if-three-conditions-and"
title = "Three things true"
prompt = "If Lisa, David and Matthew are all free during rest hour, they have a 'directors huddle' during playstation."
answer = "IF staff.lisa FREE DURING blocks.rest_hour AND staff.david FREE DURING blocks.rest_hour AND staff.matthew FREE DURING blocks.rest_hour\nREQUEST ALL_OF staff.directors DO 'directors huddle' DURING blocks.playstation"
alternatives = ["IF\nstaff.lisa FREE DURING blocks.rest_hour\nAND staff.david FREE DURING blocks.rest_hour\nAND staff.matthew FREE DURING blocks.rest_hour\nREQUEST ALL_OF staff.directors DO 'directors huddle' DURING blocks.playstation"]
wrong = ["IF staff.lisa FREE DURING blocks.rest_hour AND staff.david FREE DURING blocks.rest_hour\nREQUEST ALL_OF staff.directors DO 'directors huddle' DURING blocks.playstation"]

[[problem]]
id = "if-each-counselor-lunch-break"
title = "Break then cover"
prompt = "For each counselor: if they are on 'break' during lunch, their buddy does 'cabin cover' during lunch."
answer = "EACH_OF c IN staff.counselors\nIF c DO 'break' DURING blocks.lunch\nREQUEST mappings.buddy(c) DO 'cabin cover' DURING blocks.lunch"
priority = "HIGH"
wrong = ["EACH_OF c IN staff.counselors\nREQUEST mappings.buddy(c) DO 'cabin cover' DURING blocks.lunch"]

[[problem]]
id = "if-busy-evening"
title = "A busy evening"
prompt = "If Tori has something assigned in either evening block, she is free during clinic 4."
answer = "IF staff.tori NOT FREE DURING blocks.evening\nREQUEST staff.tori FREE DURING blocks.clinic_4"
explain = "In a condition, a set of blocks means any of them: one busy evening block is enough."
alternatives = ["IF staff.tori NOT FREE DURING blocks.embers OR staff.tori NOT FREE DURING blocks.evening_program\nREQUEST staff.tori FREE DURING blocks.clinic_4"]
wrong = ["IF staff.tori NOT FREE DURING blocks.embers AND staff.tori NOT FREE DURING blocks.evening_program\nREQUEST staff.tori FREE DURING blocks.clinic_4"]

[[problem]]
id = "if-or-many-clinic"
title = "Plenty of archery"
prompt = "If Archery 1 & 2 runs in clinic 2 or in clinic 3, Gabe does 'target repair' during clinic 4."
answer = "IF staff.all DO activities.clinics.archery_1_2 DURING {blocks.clinic_2 + blocks.clinic_3}\nREQUEST staff.gabe DO 'target repair' DURING blocks.clinic_4"
alternatives = ["IF staff.all DO activities.clinics.archery_1_2 DURING blocks.clinic_2 OR staff.all DO activities.clinics.archery_1_2 DURING blocks.clinic_3\nREQUEST staff.gabe DO 'target repair' DURING blocks.clinic_4"]
wrong = ["IF staff.all DO activities.clinics.archery_1_2 DURING blocks.clinic_2\nREQUEST staff.gabe DO 'target repair' DURING blocks.clinic_4"]
