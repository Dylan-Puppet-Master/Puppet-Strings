[level]
name = "Advanced"
blurb = "Several ideas in one request."
day = "2026-08-04"
teaches = """
Checklist:

  1. Who: one person, ALL a set, ANY of it, ANY n of it, a cap on it, or EACH it?
  2. What: a quoted task, an activity, FREE, BUSY, or NOT?
  3. When: which blocks and dates — all of them, any, or how many?
  4. How long: FOR each piece (DURING), or the total (ACROSS)?
  5. REQUEST (met or not) or PREFER (closer is better)?
  6. Does it depend on anything (IF / UNLESS)?
"""

[[problem]]
id = "big-breaks-policy"
title = "The break policy"
prompt = "Every staff member who isn't a director or counselor gets three 30-minute 'break's in three different blocks — and never more than ten people on break in the same block."
answer = "REQUEST EACH {staff - staff.directors - staff.counselors} DO 'break' FOR EXACTLY 30m DURING ANY 3 blocks\nREQUEST AT_MOST 10 staff DO 'break' DURING EACH blocks"
priority = "MUST_HAPPEN"
wrong = ["REQUEST EACH {staff - staff.directors - staff.counselors} DO 'break' FOR EXACTLY 30m DURING ANY 3 blocks"]

[[problem]]
id = "big-counselor-hours"
title = "Counselor hours"
prompt = "Each counselor gets a one-hour 'counselor hour' in clinic 1 or clinic 2, and another in playstation or clinic 3, no more than five hours apart."
answer = "EACH c IN staff.counselors\nmorning:   REQUEST c DO 'counselor hour' FOR EXACTLY 1h DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}\nafternoon: REQUEST c DO 'counselor hour' FOR EXACTLY 1h DURING ANY 1 {blocks.playstation + blocks.clinic_3}\nGAP morning TO afternoon AT_MOST 5h"
priority = "MUST_HAPPEN"
wrong = ["EACH c IN staff.counselors\nmorning:   REQUEST c DO 'counselor hour' FOR EXACTLY 1h DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}\nafternoon: REQUEST c DO 'counselor hour' FOR EXACTLY 1h DURING ANY 1 {blocks.clinic_3 + blocks.clinic_4}\nGAP morning TO afternoon AT_MOST 5h"]

[[problem]]
id = "big-playstation-available"
title = "Playstation availability"
prompt = "As many non-directors as possible should be free during playstation; each free person counts."
answer = "REQUEST EACH {staff - staff.directors} FREE DURING blocks.playstation"
priority = "HIGH"
wrong = ["REQUEST ALL {staff - staff.directors} FREE DURING blocks.playstation"]

[[problem]]
id = "big-meal-breaks"
title = "Breaks at meal times"
prompt = "Staff who aren't directors or counselors shouldn't take a 'break' outside meal times — one small request per person per non-meal block."
answer = "REQUEST EACH {staff - staff.directors - staff.counselors} NOT DO 'break' DURING EACH {blocks - blocks.meals}"
priority = "HIGH"
wrong = ["REQUEST EACH {staff - staff.directors - staff.counselors} NOT DO 'break' DURING ANY {blocks - blocks.meals}"]

[[problem]]
id = "big-ropes-rotation"
title = "Rotating ropes"
prompt = "Over the session, we'd like nobody to be first on the Climbing Wall more than 3 times."
answer = "PREFER EACH staff DO activities.clinics.climbing_wall AS_ROLE roles.first DURING AT_MOST 3 blocks ON ANY dates.session_6"
priority = "LOW"
hints = ["Count the blocks, over any day of the session."]
wrong = ["REQUEST EACH staff DO activities.clinics.climbing_wall AS_ROLE roles.first DURING AT_MOST 3 blocks ON ANY dates.session_6"]

[[problem]]
id = "big-new-archer"
title = "A new archer"
prompt = "Gabe trains on Archery 1 & 2 as a trainee for at least two hours sometime between today and Friday."
answer = "REQUEST staff.gabe DO activities.clinics.archery_1_2 AS_ROLE roles.trainee ON ANY {dates.target .. 2026-08-07} FOR AT_LEAST 2h ACROSS ANY blocks"
wrong = ["REQUEST staff.gabe DO activities.clinics.archery_1_2 AS_ROLE roles.trainee FOR AT_LEAST 2h ACROSS ANY blocks"]

[[problem]]
id = "big-leaders-evening"
title = "Evening coverage"
prompt = "In each evening block, one village leader is on 'night patrol', and each leader does no more than one patrol today."
answer = "REQUEST ANY 1 staff.village_leaders DO 'night patrol' DURING EACH blocks.evening\nREQUEST EACH staff.village_leaders DO 'night patrol' DURING AT_MOST 1 blocks"
priority = "MUST_HAPPEN"
hints = ["One statement picks a leader for each evening block; another caps each leader."]
explain = "ANY 1 picks and forbids nothing, so on its own one leader could patrol both blocks. The cap on each leader is what spreads the patrols out."
wrong = ["REQUEST ANY 1 staff.village_leaders DO 'night patrol' DURING EACH blocks.evening"]

[[problem]]
id = "big-front-desk"
title = "The front desk"
prompt = "Unless a director is free during clinic 1, one permanent hero who isn't a director covers the 'front desk' then — and it's never Rob."
answer = "UNLESS ANY staff.directors FREE DURING blocks.clinic_1 THEN\n{\n    REQUEST ANY 1 {staff.permanent_heroes - staff.directors - staff.rob} DO 'front desk' DURING blocks.clinic_1\n}"
wrong = ["REQUEST ANY 1 {staff.permanent_heroes - staff.directors - staff.rob} DO 'front desk' DURING blocks.clinic_1"]

[[problem]]
id = "big-zip-with-backup"
title = "Zip line with backup"
prompt = "The Gravity Zip Line runs during clinic 2, and Rob is only on it if Vic is too."
answer = "REQUEST activities.clinics.gravity_zip_line DURING blocks.clinic_2\nREQUEST staff.rob NOT DO activities.clinics.gravity_zip_line WITHOUT staff.vic"
priority = "HIGH"
wrong = ["REQUEST activities.clinics.gravity_zip_line DURING blocks.clinic_2"]

[[problem]]
id = "big-directors-rotation"
title = "Directors on duty"
prompt = "In each clinic block, one director is 'on duty', and no director is on duty twice in a row."
answer = "REQUEST ANY 1 staff.directors DO 'on duty' DURING EACH blocks.all_clinics\nREQUEST EACH staff.directors DO 'on duty' DURING AT_MOST 1 CONSECUTIVE blocks"
priority = "MUST_HAPPEN"
wrong = ["REQUEST ANY 1 staff.directors DO 'on duty' DURING EACH blocks.all_clinics"]

[[problem]]
id = "big-video-day"
title = "Video day"
prompt = "Some day this week (today to Friday), Alesa and one of Dylan or Cam VL shoot 'video' together for 30 minutes, in any block."
answer = "ANY 1 v IN {staff.dylan + staff.cam_vl}\nREQUEST ALL {staff.alesa + v} DO 'video' FOR EXACTLY 30m DURING ANY 1 blocks ON ANY 1 {dates.target .. 2026-08-07}"
wrong = ["ANY 1 v IN {staff.dylan + staff.cam_vl}\nREQUEST ALL {staff.alesa + v} DO 'video' DURING ANY 1 blocks ON ANY 1 {dates.target .. 2026-08-07}"]

[[problem]]
id = "big-rest-after-long-morning"
title = "A long morning"
prompt = "For each village leader: if they're busy in both clinic 1 and clinic 2, they get rest hour free. Make it count per leader."
answer = "EACH c IN staff.village_leaders\nIF c BUSY DURING blocks.clinic_1 AND c BUSY DURING blocks.clinic_2 THEN\n{\n    REQUEST c FREE DURING blocks.rest_hour\n}"
priority = "HIGH"
hints = ["BUSY DURING ANY {a + b} is busy in either one. For both, ALL {a + b}, or two tests joined with AND."]
alternatives = ["EACH c IN staff.village_leaders\nIF c BUSY DURING ALL {blocks.clinic_1 + blocks.clinic_2} THEN\n{\n    REQUEST c FREE DURING blocks.rest_hour\n}"]
wrong = ["EACH c IN staff.village_leaders\nIF c BUSY DURING ANY {blocks.clinic_1 + blocks.clinic_2} THEN\n{\n    REQUEST c FREE DURING blocks.rest_hour\n}"]

[[problem]]
id = "big-unbroken-training"
title = "Unbroken training"
prompt = "Tori trains on Candle Making, as a trainee, for two clinic blocks in a row, some day between today and Friday."
answer = "REQUEST staff.tori DO activities.clinics.candle_making AS_ROLE roles.trainee DURING ANY 2 CONSECUTIVE blocks.all_clinics ON ANY 1 {dates.target .. 2026-08-07}"
hints = ["ANY 2 CONSECUTIVE blocks.all_clinics is two clinic blocks next to each other; ANY 1 of the dates is the day."]
explain = "Each pick is made once for the statement: one day, and two blocks in a row on it."
alternatives = ["REQUEST staff.tori DO activities.clinics.candle_making AS_ROLE roles.trainee ON ANY 1 {dates.target .. 2026-08-07} DURING ANY 2 CONSECUTIVE blocks.all_clinics"]
wrong = [
  "REQUEST staff.tori DO activities.clinics.candle_making AS_ROLE roles.trainee DURING ANY 2 blocks.all_clinics ON ANY 1 {dates.target .. 2026-08-07}",
  "REQUEST staff.tori DO activities.clinics.candle_making AS_ROLE roles.trainee DURING ANY 2 CONSECUTIVE blocks.all_clinics",
]

[[problem]]
id = "big-trainee-with-trainer"
title = "Trainee with a trainer"
prompt = "Caroline trains on the Climbing Wall in whichever clinic block it runs, with Alan first on that same run of it."
answer = "REQUEST staff.caroline DO activities.clinics.climbing_wall AS_ROLE roles.trainee WITH staff.alan AS_ROLE roles.first DURING ANY blocks.all_clinics"
hints = ["An AS_ROLE straight after WITH's people is theirs: WITH staff.alan AS_ROLE roles.first.", "Caroline's own AS_ROLE goes before the WITH."]
explain = "Two REQUEST lines, one for each of them, could land in different blocks. WITH ties Alan's role to the very instance Caroline trains on. Leave Caroline's own AS_ROLE out and she could hold any position on it rather than train."
wrong = ["REQUEST staff.caroline DO activities.clinics.climbing_wall WITH staff.alan AS_ROLE roles.first DURING ANY blocks.all_clinics"]

[[problem]]
id = "big-the-original"
title = "Where AND began"
prompt = "If two counselors are on 'break' in the same block — any block — and Dylan is free during lunch, Dylan does 'cabin cover' during lunch. Put each condition on its own line, joined by AND."
answer = "IF\nAT_LEAST 2 staff.counselors DO 'break' DURING EACH blocks\nAND\nstaff.dylan FREE DURING blocks.lunch THEN\n{\n    REQUEST staff.dylan DO 'cabin cover' DURING blocks.lunch\n}"
hints = ["EACH blocks makes a copy per block, each asking whether two counselors are on break in it."]
explain = "Without EACH, DURING ANY blocks would ask whether two counselors had a break at all today, whether or not at the same time."
wrong = ["IF\nAT_LEAST 2 staff.counselors DO 'break' DURING ANY blocks\nAND\nstaff.dylan FREE DURING blocks.lunch THEN\n{\n    REQUEST staff.dylan DO 'cabin cover' DURING blocks.lunch\n}"]

[[problem]]
id = "big-prefer-maintenance-range"
title = "Between two and three hours"
prompt = "We'd like each MFG to spend between two and three hours on 'maintenance' today, in any blocks — less or more both cost a little. One request per MFG."
answer = "EACH m IN staff.mfgs\nPREFER m DO 'maintenance' FOR AT_LEAST 2h ACROSS ANY blocks\nPREFER m DO 'maintenance' FOR AT_MOST 3h ACROSS ANY blocks"
priority = "MEDIUM"
hints = ["A range is two PREFER lines, one for each end.", "With ACROSS, FOR is the total."]
explain = "Each PREFER is weighed on its own, so the day is marked down for falling short of two hours and for going past three."
wrong = ["EACH m IN staff.mfgs\nPREFER m DO 'maintenance' FOR EXACTLY 2h ACROSS ANY blocks"]

[[problem]]
id = "big-prefer-counselor-load"
title = "Counselors' clinic load"
prompt = "For each counselor today: never more than three clinic activities, never three in a row, and we'd like them to run at least two different clinics."
answer = "EACH c IN staff.counselors\nREQUEST c DO ANY activities.clinics DURING AT_MOST 3 blocks\nREQUEST c DO ANY activities.clinics DURING AT_MOST 2 CONSECUTIVE blocks\nPREFER c DO AT_LEAST 2 activities.clinics"
priority = "HIGH"
hints = ["A binding line, then one line for each thing asked.", "Different clinics is a count of the clinics: DO AT_LEAST 2 activities.clinics."]
explain = "The two REQUEST lines stand or fall together; the PREFER is weighed on its own. Counting blocks instead would let the same clinic twice count as two."
wrong = ["EACH c IN staff.counselors\nREQUEST c DO ANY activities.clinics DURING AT_MOST 3 blocks\nREQUEST c DO ANY activities.clinics DURING AT_MOST 2 CONSECUTIVE blocks\nPREFER c DO ANY activities.clinics DURING AT_LEAST 2 blocks"]

[[problem]]
id = "big-prefer-session-facilitating"
title = "Everyone facilitates, nobody too much"
prompt = "Over the session, each village leader is first on at most three clinics, and we'd like each of them to be first on at least one."
answer = "EACH c IN staff.village_leaders\nREQUEST c DO ANY activities.clinics AS_ROLE roles.first DURING AT_MOST 3 blocks ON ANY dates.session_6\nPREFER c DO ANY activities.clinics AS_ROLE roles.first DURING AT_LEAST 1 blocks ON ANY dates.session_6"
priority = "HIGH"
hints = ["Over ANY dates of the session, a count of blocks counts every block of every day."]
wrong = ["EACH c IN staff.village_leaders\nREQUEST c DO ANY activities.clinics AS_ROLE roles.first DURING AT_MOST 3 blocks ON EACH dates.session_6\nPREFER c DO ANY activities.clinics AS_ROLE roles.first DURING AT_LEAST 1 blocks ON EACH dates.session_6"]

[[problem]]
id = "big-farrier-visit"
title = "The farrier"
prompt = "Hailey and one other EQ staff member meet the 'farrier' together for an hour in clinic 1 or clinic 2. Later the same day, at least three hours after the farrier leaves, Hailey does a 30-minute 'hoof check'."
answer = "ANY 1 e IN {staff.eq_staff - staff.hailey}\nvisit: REQUEST ALL {staff.hailey + e} DO 'farrier' FOR EXACTLY 1h DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}\ncheck: REQUEST staff.hailey DO 'hoof check' FOR EXACTLY 30m DURING ANY 1 blocks\nGAP visit TO check AT_LEAST 3h"
priority = "HIGH"
hints = ["Name the other EQ staff member with a binding line, and add them into a set with Hailey.", "ALL of them with ANY 1 of the blocks is one block they share.", "Label the two lines, and GAP from the visit to the check."]
explain = "ALL {staff.hailey + e} is one unit, so the block picked is one they share. ANY blocks in its place would give each of them a block of their own."

wrong = ["ANY 1 e IN {staff.eq_staff - staff.hailey}\nvisit: REQUEST ALL {staff.hailey + e} DO 'farrier' FOR EXACTLY 1h DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}\ncheck: REQUEST staff.hailey DO 'hoof check' FOR EXACTLY 30m DURING ANY 1 blocks\nGAP visit TO check AT_LEAST 0m"]

[[problem]]
id = "big-long-afternoon"
title = "After a long afternoon"
prompt = "For each director: if they're busy through both afternoon clinic blocks, they're free at dinner, and we'd like them to get at least an hour of 'paperwork' across rest hour and playstation as well. One request per director."
answer = "EACH d IN staff.directors\nIF d BUSY DURING ALL {blocks.clinic_3 + blocks.clinic_4} THEN\n{\n    REQUEST d FREE DURING blocks.dinner\n    PREFER d DO 'paperwork' FOR AT_LEAST 1h ACROSS ANY {blocks.rest_hour + blocks.playstation}\n}"
priority = "MEDIUM"
hints = ["Busy through both is BUSY DURING ALL {…} in the condition.", "A condition governs the PREFER as well as the REQUEST."]
wrong = ["EACH d IN staff.directors\nIF d BUSY DURING ANY {blocks.clinic_3 + blocks.clinic_4} THEN\n{\n    REQUEST d FREE DURING blocks.dinner\n    PREFER d DO 'paperwork' FOR AT_LEAST 1h ACROSS ANY {blocks.rest_hour + blocks.playstation}\n}"]

[[problem]]
id = "big-trainees-supervised"
title = "Leaders train leaders"
prompt = "No village leader is a trainee on any clinic unless another village leader is first on that same run of it — and we'd like each village leader to train at least once this week (today to Friday). One request per leader."
answer = "EACH v IN staff.village_leaders\nREQUEST v NOT DO ANY activities.clinics AS_ROLE roles.trainee WITHOUT AT_LEAST 1 staff.village_leaders AS_ROLE roles.first\nPREFER v DO ANY activities.clinics AS_ROLE roles.trainee DURING AT_LEAST 1 blocks ON ANY {dates.target .. 2026-08-07}"
priority = "HIGH"
hints = ["X only if Y: X NOT DO it WITHOUT Y. The other leaders' role goes straight after them.", "WITH and WITHOUT count others, so the leader is never their own company.", "A week of dates is one pool: ON ANY {…}."]
explain = "The AS_ROLE after the leader's DO is theirs (trainee); the one after WITHOUT's people is the other leaders' (first). A scaffolded trainee already needs a trainer on the instance, which the solver keeps on its own; this is a camp policy on top of that."
wrong = ["EACH v IN staff.village_leaders\nREQUEST v NOT DO ANY activities.clinics AS_ROLE roles.trainee WITHOUT ALL staff.village_leaders AS_ROLE roles.first\nPREFER v DO ANY activities.clinics AS_ROLE roles.trainee DURING AT_LEAST 1 blocks ON ANY {dates.target .. 2026-08-07}"]
