[level]
name = "WITH and WITHOUT"
blurb = "Who is working alongside whom."
day = "2026-08-04"
teaches = """
... WITH staff.vic              Vic is on the same clinic or task, alongside
... WITH AT_LEAST 1 staff.mfgs   at least one MFG is (AT_LEAST 2: at least two)
... WITH ALL staff.mfgs        every MFG is
... WITHOUT <staff>             the opposite of WITH <staff>
... WITH staff.vic AS_ROLE roles.first   Vic is on it, first

One name stands alone; a set of several says how many of it with ALL or a count.

REQUEST staff.rob NOT DO ANY activities.clinics.ropes WITHOUT staff.vic
REQUEST staff.jack NOT DO ANY activities.clinics.all WITH staff.lucy

"X only if Y is there too" is always:  X NOT DO it WITHOUT Y
"""

[[problem]]
id = "with-rob-needs-vic"
title = "Only with Vic"
prompt = "If Rob is on a ropes clinic, Vic must be on it with him."
answer = "REQUEST staff.rob NOT DO ANY activities.clinics.ropes WITHOUT staff.vic"
priority = "MUST_HAPPEN"
hints = ["'X only if Y is there' is written X NOT DO it WITHOUT Y."]
explain = "Rob may not do ropes without Vic: so either he isn't on ropes, or Vic is there too."
wrong = [
  "REQUEST staff.rob NOT DO ANY activities.clinics.ropes WITH staff.vic",
  "REQUEST staff.vic NOT DO ANY activities.clinics.ropes WITHOUT staff.rob",
]

[[problem]]
id = "with-never-together"
title = "Keep them apart"
prompt = "Gabe and Julian never run the same clinic together."
answer = "REQUEST staff.gabe NOT DO ANY activities.clinics.all WITH staff.julian"
priority = "MUST_HAPPEN"
alternatives = ["REQUEST staff.julian NOT DO ANY activities.clinics.all WITH staff.gabe"]
wrong = ["REQUEST staff.gabe NOT DO ANY activities.clinics.all WITHOUT staff.julian"]

[[problem]]
id = "with-store-pair"
title = "Store with a friend"
prompt = "Jana runs the 'camp store' during clinic 1, with Kara working it alongside her."
answer = "REQUEST staff.jana DO 'camp store' DURING blocks.clinic_1 WITH staff.kara"
explain = "WITH on a positive request asks for the partner too."
alternatives = ["REQUEST ALL {staff.jana + staff.kara} DO 'camp store' DURING blocks.clinic_1"]
wrong = ["REQUEST staff.jana DO 'camp store' DURING blocks.clinic_1"]

[[problem]]
id = "with-junior-senior"
title = "Never alone on the water"
prompt = "No counselor does 'canoe safety' unless a director is doing it with them. One request per counselor."
answer = "REQUEST EACH staff.counselors NOT DO 'canoe safety' WITHOUT AT_LEAST 1 staff.directors"
priority = "HIGH"
wrong = ["REQUEST EACH staff.counselors NOT DO 'canoe safety' WITH AT_LEAST 1 staff.directors"]

[[problem]]
id = "with-no-mfg-together"
title = "Spread the MFGs"
prompt = "Charlton never does 'trail work' alongside another MFG."
answer = "REQUEST staff.charlton NOT DO 'trail work' WITH AT_LEAST 1 {staff.mfgs - staff.charlton}"
priority = "MUST_HAPPEN"
alternatives = ["REQUEST staff.charlton NOT DO 'trail work' WITH AT_LEAST 1 {staff.alan + staff.connor}"]
wrong = ["REQUEST staff.charlton NOT DO 'trail work' WITH staff.alan"]

[[problem]]
id = "with-shared-clinic-each-block"
title = "One point per clinic"
prompt = "Gabe and Peyton shouldn't share a clinic. Make it one small request per block, so each shared clinic costs a point."
answer = "REQUEST staff.gabe NOT DO ANY activities.clinics.all WITH staff.peyton DURING EACH blocks.all"
priority = "HIGH"
wrong = ["REQUEST staff.gabe NOT DO ANY activities.clinics.all WITH staff.peyton"]

[[problem]]
id = "with-trainer-present"
title = "A trainer nearby"
prompt = "Alan only works the Climbing Wall when Charlton is on it too."
answer = "REQUEST staff.alan NOT DO activities.clinics.climbing_wall WITHOUT staff.charlton"
priority = "MUST_HAPPEN"
wrong = ["REQUEST staff.charlton NOT DO activities.clinics.climbing_wall WITHOUT staff.alan"]

[[problem]]
id = "with-heroes-pair"
title = "Partners"
prompt = "Khushi does 'cabin inspections' during rest hour, alongside some village leader."
answer = "REQUEST staff.khushi DO 'cabin inspections' DURING blocks.rest_hour WITH AT_LEAST 1 staff.village_leaders"
wrong = ["REQUEST staff.khushi DO 'cabin inspections' DURING blocks.rest_hour"]

[[problem]]
id = "with-without-directors-desk"
title = "Never alone at the desk"
prompt = "Each village hero may only do 'front desk' when a permanent hero is on the desk with them."
answer = "REQUEST EACH staff.village_heroes NOT DO 'front desk' WITHOUT AT_LEAST 1 staff.permanent_heroes"
priority = "HIGH"
wrong = ["REQUEST EACH staff.village_heroes NOT DO 'front desk' WITHOUT AT_LEAST 1 staff.directors"]

[[problem]]
id = "with-apart-at-meals"
title = "Apart at meals"
prompt = "Diya and Audrey never do 'kitchen help' together at a meal."
answer = "REQUEST staff.diya NOT DO 'kitchen help' WITH staff.audrey DURING ANY blocks.meals"
priority = "MUST_HAPPEN"
wrong = ["REQUEST staff.diya NOT DO 'kitchen help' WITH staff.audrey DURING blocks.lunch"]

[[problem]]
id = "with-ropes-pair-each"
title = "Every ropes counselor has backup"
prompt = "No counselor is on the Giant Swing unless an MFG is on it with them. One request per counselor."
answer = "REQUEST EACH staff.counselors NOT DO activities.clinics.giant_swing WITHOUT AT_LEAST 1 staff.mfgs"
priority = "HIGH"
hints = ["At least one of them: AT_LEAST 1 staff.mfgs."]
wrong = [
  "REQUEST EACH staff.counselors NOT DO activities.clinics.giant_swing WITH AT_LEAST 1 staff.mfgs",
  "REQUEST EACH staff.counselors NOT DO activities.clinics.giant_swing WITHOUT ALL staff.mfgs",
]

[[problem]]
id = "with-both-trainers"
title = "Both trainers"
prompt = "Rob only works ropes when both Vic and Charlton are on it with him."
answer = "REQUEST staff.rob NOT DO ANY activities.clinics.ropes WITHOUT ALL {staff.vic + staff.charlton}"
priority = "MUST_HAPPEN"
explain = "WITHOUT ALL: if either of them is missing, Rob is off ropes."
wrong = ["REQUEST staff.rob NOT DO ANY activities.clinics.ropes WITHOUT AT_LEAST 1 {staff.vic + staff.charlton}"]

[[problem]]
id = "with-both-on-it"
title = "Always as a pair"
prompt = "Hailey and Alyce do 'horse shoeing' together during clinic 2 — write it with WITH."
answer = "REQUEST staff.hailey DO 'horse shoeing' DURING blocks.clinic_2 WITH staff.alyce"
alternatives = ["REQUEST ALL {staff.hailey + staff.alyce} DO 'horse shoeing' DURING blocks.clinic_2"]
wrong = ["REQUEST staff.hailey DO 'horse shoeing' DURING blocks.clinic_2 WITH staff.alexis"]

[[problem]]
id = "with-in-a-role"
title = "Only with Vic first"
prompt = "Rob is on the Gravity Zip Line only when Vic is first on it — Vic merely being on it isn't enough."
answer = "REQUEST staff.rob NOT DO activities.clinics.gravity_zip_line WITHOUT staff.vic AS_ROLE roles.first"
hints = ["X only if Y is there too: X NOT DO it WITHOUT Y.", "An AS_ROLE straight after the people of WITHOUT is their role: WITHOUT staff.vic AS_ROLE roles.first."]
explain = "An AS_ROLE straight after WITH's or WITHOUT's people is theirs, not Rob's. Rob's own role, if he had one, would go before the WITHOUT."
wrong = ["REQUEST staff.rob NOT DO activities.clinics.gravity_zip_line WITHOUT staff.vic"]
