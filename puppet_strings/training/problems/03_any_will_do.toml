  "REQUEST staff.tyson DO 'paintball cleanup' DURING ANY {blocks.embers + blocks.evening_program}",
]
wrong = ["REQUEST staff.tyson DO 'paintball cleanup' DURING ALL blocks.evening"]

[[problem]]
