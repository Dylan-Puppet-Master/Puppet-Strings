prompt = "On the last day of the session, one director does 'parent greeting' at one of the meals."
answer = "REQUEST ANY 1 staff.directors DO 'parent greeting' DURING ANY blocks.meals ON 2026-08-08"
wrong = ["REQUEST ANY 1 staff.directors DO 'parent greeting' DURING ANY blocks.meals"]

[[problem]]
id = "any-one-is-plenty"
title = "Everybody or anybody?"
prompt = "Somebody from the MFGs — just one — does 'generator check' during setup."
answer = "REQUEST ANY 1 staff.mfgs DO 'generator check' DURING blocks.setup"
wrong = ["REQUEST ALL staff.mfgs DO 'generator check' DURING blocks.setup"]

[[problem]]
id = "any-two-meals"
title = "Two meals out of three"
prompt = "Samaya does 'allergy table' at two of today's three meals."
answer = "REQUEST staff.samaya DO 'allergy table' DURING ANY 2 blocks.meals"
wrong = ["REQUEST staff.samaya DO 'allergy table' DURING ALL blocks.meals"]

[[problem]]
id = "any-two-in-a-row"
title = "Two in a row"
prompt = "Rob does 'range repair' for two clinic blocks in a row."
answer = "REQUEST staff.rob DO 'range repair' DURING ANY 2 CONSECUTIVE blocks.all_clinics"
hints = ["Two of the clinic blocks is ANY 2 blocks.all_clinics. CONSECUTIVE between the number and the blocks keeps them together."]

explain = "Blocks are next to each other when they are next to each other on the Blocks sheet, so clinic 2 and clinic 3 are not."
wrong = ["REQUEST staff.rob DO 'range repair' DURING ANY 2 blocks.all_clinics"]
