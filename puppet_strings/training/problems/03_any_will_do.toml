[level]
name = "Some of them: ANY and ANY n"
blurb = "Letting the solver pick which people, blocks or dates."
day = "2026-08-04"
teaches = """
ANY <set>           any of them will do
ANY n <set>         the solver picks n of them

REQUEST ANY 1 staff.directors DO 'office' DURING blocks.clinic_1
REQUEST staff.rob DO 'break' DURING ANY blocks.meals
REQUEST ANY 2 staff.mfgs DO 'mowing' DURING ANY blocks.all_clinics
REQUEST staff.rob DO 'range repair' DURING ANY 2 CONSECUTIVE blocks.all_clinics

• ANY n goes right in front of the set it picks from
• ANY with no number: any one of them will do
• A pick is made once, for the whole statement
• Picking never forbids: the others are still free to do it too
• Leave DURING out and it is any block of the day
• ALL is one unit: ALL <people> … DURING ANY 1 <blocks> is one block they share
• A single name (staff.rob) never takes a quantifier
• ANY n CONSECUTIVE <blocks>: blocks next to each other
"""

[[problem]]
id = "any-one-director"
title = "Somebody in the office"
prompt = "One of the directors — any one — covers the 'front office' during clinic 1."
answer = "REQUEST ANY 1 staff.directors DO 'front office' DURING blocks.clinic_1"
hints = ["When the solver may pick, say how many: ANY 1 in front of the set."]
explain = "ANY 1 lets the solver pick whichever director fits the rest of the day best. ANY staff.directors, with no number, says the same here: any of them will do."
alternatives = [
  "REQUEST ANY 1 {staff.david + staff.lisa + staff.matthew} DO 'front office' DURING blocks.clinic_1",
  "REQUEST ANY staff.directors DO 'front office' DURING blocks.clinic_1",
]
wrong = [
  "REQUEST ALL staff.directors DO 'front office' DURING blocks.clinic_1",
  "REQUEST ANY 1 {staff.david + staff.lisa} DO 'front office' DURING blocks.clinic_1",
]

[[problem]]
id = "any-one-meal"
title = "Break at some meal"
prompt = "Rob takes a 'break' at one of the meals — whichever works."
answer = "REQUEST staff.rob DO 'break' DURING ANY blocks.meals"
hints = ["Rob is one person, so no quantifier on him. The choice is in the blocks: ANY blocks.meals."]
explain = "ANY blocks.meals is any meal will do. ANY 1 blocks.meals, one meal the solver picks, says the same for one person."
alternatives = [
  "REQUEST staff.rob DO 'break' DURING ANY 1 blocks.meals",
  "REQUEST staff.rob DO 'break' DURING ANY {blocks.breakfast + blocks.lunch + blocks.dinner}",
]
wrong = [
  "REQUEST staff.rob DO 'break' DURING ALL blocks.meals",
  "REQUEST staff.rob DO 'break' DURING blocks.lunch",
]

[[problem]]
id = "any-two-mfgs"
title = "Two of three"
prompt = "Two of the MFGs do 'mowing' during clinic 2."
answer = "REQUEST ANY 2 staff.mfgs DO 'mowing' DURING blocks.clinic_2"
hints = ["ANY 2 in front of the MFGs picks two of them."]
explain = "ANY 2 picks two and forbids nothing: the third MFG may still mow if the day puts them there."
wrong = [
  "REQUEST ANY 1 staff.mfgs DO 'mowing' DURING blocks.clinic_2",
  "REQUEST ALL staff.mfgs DO 'mowing' DURING blocks.clinic_2",
]

[[problem]]
id = "any-lucy-or-tom"
title = "One or the other"
prompt = "Either Kara or Paul does 'recycling' during rest hour."
answer = "REQUEST ANY 1 {staff.kara + staff.paul} DO 'recycling' DURING blocks.rest_hour"
alternatives = [
  "REQUEST ANY 1 {staff.paul + staff.kara} DO 'recycling' DURING blocks.rest_hour",
  "REQUEST ANY {staff.kara + staff.paul} DO 'recycling' DURING blocks.rest_hour",
]
wrong = ["REQUEST ALL {staff.kara + staff.paul} DO 'recycling' DURING blocks.rest_hour"]

[[problem]]
id = "any-block-any-time"
title = "Whenever it fits"
prompt = "Dylan does 'archery maintenance' at some point today — any block at all."
answer = "REQUEST staff.dylan DO 'archery maintenance' DURING ANY blocks"
hints = ["Every block is blocks; any of them will do."]
explain = "Leaving DURING out says the same thing: a statement with no DURING is about any block of the day."
alternatives = [
  "REQUEST staff.dylan DO 'archery maintenance'",
  "REQUEST staff.dylan DO 'archery maintenance' DURING ANY 1 blocks",
]
wrong = ["REQUEST staff.dylan DO 'archery maintenance' DURING ANY blocks.all_clinics"]

[[problem]]
id = "any-clinic-block"
title = "Some clinic block"
prompt = "Vic spends one of the four clinic blocks on 'harness inspection'."
answer = "REQUEST staff.vic DO 'harness inspection' DURING ANY blocks.all_clinics"
alternatives = [
  "REQUEST staff.vic DO 'harness inspection' DURING ANY 1 blocks.all_clinics",
  "REQUEST staff.vic DO 'harness inspection' DURING ANY {blocks.clinic_1 + blocks.clinic_2 + blocks.clinic_3 + blocks.clinic_4}",
]
wrong = ["REQUEST staff.vic DO 'harness inspection' DURING ANY {blocks.clinic_1 + blocks.clinic_2}"]

[[problem]]
id = "any-two-blocks"
title = "Twice today"
prompt = "Hailey does 'horse check' in two of today's clinic blocks."
answer = "REQUEST staff.hailey DO 'horse check' DURING ANY 2 blocks.all_clinics"
hints = ["Two of something is a pick: ANY 2, in front of the blocks."]
wrong = [
  "REQUEST staff.hailey DO 'horse check' DURING ANY blocks.all_clinics",
  "REQUEST staff.hailey DO 'horse check' DURING ANY 2 blocks",
]

[[problem]]
id = "any-leader-evening"
title = "Evening lead"
prompt = "One village leader leads 'campfire songs' during embers."
answer = "REQUEST ANY 1 staff.village_leaders DO 'campfire songs' DURING blocks.embers"
wrong = ["REQUEST ANY 1 staff.village_heroes DO 'campfire songs' DURING blocks.embers"]

[[problem]]
id = "any-each-their-own-block"
title = "Two mowers, any time"
prompt = "Two of the MFGs each do 'mowing' in a clinic block — each in whichever block suits them."
answer = "REQUEST ANY 2 staff.mfgs DO 'mowing' DURING ANY blocks.all_clinics"
hints = ["Pick the people; the blocks are any of them."]
explain = "ANY blocks.all_clinics is a pool, so each of the two mows in any clinic block, not necessarily the same one. ANY 1 blocks.all_clinics would pick one block, once, for both of them."
wrong = ["REQUEST ANY 2 staff.mfgs DO 'mowing' DURING ANY 1 blocks.all_clinics"]

[[problem]]
id = "any-all-in-some-block"
title = "Everyone, one block"
prompt = "All of the directors meet together for a 'directors sync' in one of the afternoon clinic blocks (clinic 3 or 4)."
answer = "REQUEST ALL staff.directors DO 'directors sync' DURING ANY 1 {blocks.clinic_3 + blocks.clinic_4}"
hints = ["ALL the directors; pick the block they meet in."]
explain = "ALL makes the directors one unit, and ANY 1 picks one block for that unit: all of them together. ANY with no number is any block for each director, which may not be the same one."
wrong = [
  "REQUEST ALL staff.directors DO 'directors sync' DURING ANY {blocks.clinic_3 + blocks.clinic_4}",
  "REQUEST ANY 1 staff.directors DO 'directors sync' DURING ANY {blocks.clinic_3 + blocks.clinic_4}",
  "REQUEST ALL staff.directors DO 'directors sync' DURING ALL {blocks.clinic_3 + blocks.clinic_4}",
]

[[problem]]
id = "any-some-day"
title = "Some day this week"
prompt = "Sometime this week (Monday to Friday), Charlton does 'shop cleanup' during rest hour."
answer = "REQUEST staff.charlton DO 'shop cleanup' DURING blocks.rest_hour ON ANY {2026-08-03 .. 2026-08-07}"
hints = ["A run of dates is written {first .. last}.", "Any of those days will do: ON ANY {...}."]
explain = "A request that can still happen later doesn't have to happen today. The solver waits until the last day it could."
alternatives = [
  "REQUEST staff.charlton DO 'shop cleanup' DURING blocks.rest_hour ON ANY {dates.session_6.week_1 & dates.weekdays}",
  "REQUEST staff.charlton DO 'shop cleanup' DURING blocks.rest_hour ON ANY 1 {2026-08-03 .. 2026-08-07}",
]
wrong = ["REQUEST staff.charlton DO 'shop cleanup' DURING blocks.rest_hour ON ANY {2026-08-03 .. 2026-08-06}"]

[[problem]]
id = "any-three-counselors"
title = "Three helpers"
prompt = "Three counselors help with 'dessert prep' during dinner."
answer = "REQUEST ANY 3 staff.counselors DO 'dessert prep' DURING blocks.dinner"
wrong = ["REQUEST ANY 2 staff.counselors DO 'dessert prep' DURING blocks.dinner"]

[[problem]]
id = "any-hero-or-leader"
