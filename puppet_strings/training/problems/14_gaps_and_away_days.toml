[level]
name = "Gaps and Exclusions"
blurb = "GAP puts time between labelled requests; EXCLUDE takes someone out of the day."
day = "2026-08-04"
teaches = """
first:  REQUEST …
second: REQUEST …
GAP first TO second [<amount>]      second starts after first ends, this far apart

EXCLUDE <who> DO '<label>' [DURING <blocks>] [ON <dates>]

EACH c IN staff.counselors
morning:   REQUEST c DO 'counselor hour' FOR EXACTLY 1h DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}
afternoon: REQUEST c DO 'counselor hour' FOR EXACTLY 1h DURING ANY 1 {blocks.playstation + blocks.clinic_3}
GAP morning TO afternoon AT_MOST 5h

EXCLUDE staff.dylan DO 'offsite' DURING ALL blocks ON 2026-08-05

• EXCLUDE is a fact, always MUST_HAPPEN, in a request of its own
• The label is what the schedule shows where they would have been
"""

[[problem]]
id = "gap-order"
title = "First this, then that"
prompt = "Charlton does 'fence posts' in one of the morning clinic blocks and 'fence rails' in one of the afternoon clinic blocks (3 or 4), with the rails after the posts."
answer = "posts: REQUEST staff.charlton DO 'fence posts' DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}\nrails: REQUEST staff.charlton DO 'fence rails' DURING ANY 1 {blocks.clinic_3 + blocks.clinic_4}\nGAP posts TO rails"
alternatives = ["posts: REQUEST staff.charlton DO 'fence posts' DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}\nrails: REQUEST staff.charlton DO 'fence rails' DURING ANY 1 {blocks.clinic_3 + blocks.clinic_4}\nGAP posts TO rails AT_LEAST 0m"]
hints = ["Label each REQUEST with a name and a colon, then GAP posts TO rails."]
explain = "A GAP with no amount is plain ordering: the second starts after the first ends."
wrong = ["posts: REQUEST staff.charlton DO 'fence posts' DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}\nrails: REQUEST staff.charlton DO 'fence rails' DURING ANY 1 blocks.all_clinics\nGAP posts TO rails AT_LEAST 0m"]

[[problem]]
id = "gap-setup-teardown"
title = "Setup, then teardown"
prompt = "The same counselor does 'campfire setup' during clinic 4, and 'campfire teardown' any time after the setup."
answer = "ANY 1 c IN staff.counselors\nsetup:    REQUEST c DO 'campfire setup' DURING blocks.clinic_4\nteardown: REQUEST c DO 'campfire teardown' DURING ANY blocks\nGAP setup TO teardown"
priority = "MEDIUM"
hints = ["The same person in two lines is a binding: ANY 1 c IN staff.counselors.", "Any time after: the teardown's blocks are ANY blocks, and GAP setup TO teardown keeps it after."]
explain = "A GAP with no amount is only the order: the teardown starts after the setup ends, however long after."
alternatives = ["ANY 1 c IN staff.counselors\nsetup:    REQUEST c DO 'campfire setup' DURING blocks.clinic_4\nteardown: REQUEST c DO 'campfire teardown' DURING ANY blocks\nGAP setup TO teardown AT_LEAST 0m"]
wrong = [
  "ANY 1 c IN staff.counselors\nREQUEST c DO 'campfire setup' DURING blocks.clinic_4\nREQUEST c DO 'campfire teardown' DURING ANY blocks",
  "ANY 1 c IN staff.counselors\nsetup:    REQUEST c DO 'campfire setup' DURING blocks.clinic_4\nteardown: REQUEST staff.dylan DO 'campfire teardown' DURING ANY blocks\nGAP setup TO teardown",
]

[[problem]]
id = "gap-hours-apart"
title = "Hours apart"
prompt = "Lisa has two 'staff meeting's today, each an hour long: one in clinic 1 or clinic 2, the other in clinic 3 or clinic 4 — at least five hours after the first one ends."
answer = "first:  REQUEST staff.lisa DO 'staff meeting' FOR EXACTLY 1h DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}\nsecond: REQUEST staff.lisa DO 'staff meeting' FOR EXACTLY 1h DURING ANY 1 {blocks.clinic_3 + blocks.clinic_4}\nGAP first TO second AT_LEAST 5h"
hints = ["Label both, then GAP first TO second with the least time between them."]
explain = "A GAP compares real times: the end of the first to the start of the second. Clinic 2 ends at 11:00 and clinic 3 starts at 15:30, so five hours rules that pair out."
wrong = ["first:  REQUEST staff.lisa DO 'staff meeting' FOR EXACTLY 1h DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}\nsecond: REQUEST staff.lisa DO 'staff meeting' FOR EXACTLY 1h DURING ANY 1 {blocks.clinic_3 + blocks.clinic_4}\nGAP first TO second AT_LEAST 0m"]

[[problem]]
id = "gap-not-too-late"
title = "Soon after"
prompt = "Dylan does a 30-minute 'medication round' in clinic 1 or clinic 2, and a second one in rest hour or playstation — no more than three hours after the first ends."
answer = "morning:   REQUEST staff.dylan DO 'medication round' FOR EXACTLY 30m DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}\nafternoon: REQUEST staff.dylan DO 'medication round' FOR EXACTLY 30m DURING ANY 1 {blocks.rest_hour + blocks.playstation}\nGAP morning TO afternoon AT_MOST 3h"
hints = ["AT_MOST in a GAP is the most time allowed between them."]
explain = "A task shorter than its block may sit anywhere in it, so the solver can slide both rounds to keep them close enough."
wrong = ["morning:   REQUEST staff.dylan DO 'medication round' FOR EXACTLY 30m DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}\nafternoon: REQUEST staff.dylan DO 'medication round' FOR EXACTLY 30m DURING ANY 1 {blocks.rest_hour + blocks.playstation}\nGAP morning TO afternoon AT_MOST 5h"]

[[problem]]
id = "gap-one-person-both"
title = "One mower, two jobs"
prompt = "The same MFG does 'mowing' in a morning clinic block and 'trimming' in an afternoon clinic block, with at least an hour between them."
answer = "ANY 1 m IN staff.mfgs\nmow:  REQUEST m DO 'mowing' DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}\ntrim: REQUEST m DO 'trimming' DURING ANY 1 {blocks.clinic_3 + blocks.clinic_4}\nGAP mow TO trim AT_LEAST 1h"
hints = ["The same person in two lines is a binding: ANY 1 m IN staff.mfgs.", "Then label the two lines and put a GAP between them."]
wrong = ["mow:  REQUEST ANY 1 staff.mfgs DO 'mowing' DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}\ntrim: REQUEST ANY 1 staff.mfgs DO 'trimming' DURING ANY 1 {blocks.clinic_3 + blocks.clinic_4}\nGAP mow TO trim AT_LEAST 1h"]

[[problem]]
id = "away-day-off"
title = "Offsite"
prompt = "Dylan is away at a training course all day Wednesday; the schedule should say 'offsite' where he'd have been."
answer = "EXCLUDE staff.dylan DO 'offsite' DURING ALL blocks ON 2026-08-05"
priority = "MUST_HAPPEN"
hints = ["EXCLUDE <who> DO '<label>' …"]
explain = "An EXCLUDE is a fact about the day, not a wish: it takes Dylan out of every block."
alternatives = ["EXCLUDE staff.dylan DO 'offsite' ON 2026-08-05", "EXCLUDE staff.dylan DO 'offsite' ON dates.session_6.week_1.wednesday"]
wrong = [
  "EXCLUDE staff.dylan DO 'offsite' ON 2026-08-06",
  "REQUEST staff.dylan FREE DURING ALL blocks ON 2026-08-05",
]

[[problem]]
id = "away-dentist"
title = "A dentist's appointment"
prompt = "Hailey is at the 'dentist' during clinic 3 and clinic 4 today."
answer = "EXCLUDE staff.hailey DO 'dentist' DURING ALL {blocks.clinic_3 + blocks.clinic_4}"
priority = "MUST_HAPPEN"
wrong = ["EXCLUDE staff.hailey DO 'dentist' DURING blocks.clinic_3"]

[[problem]]
id = "away-directors-meeting"
title = "Board meeting"
prompt = "All three directors are at a 'board meeting' offsite during the whole morning — setup, breakfast, clinic 1 and clinic 2 — on Thursday."
answer = "EXCLUDE ALL staff.directors DO 'board meeting' DURING ALL {blocks.setup + blocks.breakfast + blocks.clinic_1 + blocks.clinic_2} ON 2026-08-06"
priority = "MUST_HAPPEN"
alternatives = ["EXCLUDE ALL {staff.david + staff.lisa + staff.matthew} DO 'board meeting' DURING ALL {blocks.setup + blocks.breakfast + blocks.clinic_1 + blocks.clinic_2} ON dates.session_6.week_1.thursday"]
wrong = ["EXCLUDE ALL staff.directors DO 'board meeting' DURING ALL {blocks.breakfast + blocks.clinic_1 + blocks.clinic_2} ON 2026-08-06"]

[[problem]]
id = "away-two-days"
title = "Two days out"
prompt = "Rob is away on 'vacation' Thursday and Friday."
answer = "EXCLUDE staff.rob DO 'vacation' ON ALL {2026-08-06 .. 2026-08-07}"
priority = "MUST_HAPPEN"
alternatives = ["EXCLUDE staff.rob DO 'vacation' ON ALL {2026-08-06 + 2026-08-07}", "EXCLUDE staff.rob DO 'vacation' DURING ALL blocks ON ALL {2026-08-06 .. 2026-08-07}"]
wrong = ["EXCLUDE staff.rob DO 'vacation' ON 2026-08-06"]
