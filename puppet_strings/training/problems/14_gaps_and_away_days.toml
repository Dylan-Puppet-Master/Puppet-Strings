[level]
name = "Gaps and Exclusions"
blurb = "GAP puts time between labelled requests; EXCLUDE takes someone out of the day."
day = "2026-08-04"
teaches = """
first:  REQUEST …
second: REQUEST …
GAP first TO second <amount>        second starts after first ends, this far apart

EXCLUDE <who> DO '<label>' [DURING <blocks>] [ON <dates>]

EACH_OF c IN staff.counselors
morning:   REQUEST c DO 'counselor hour' FOR 1h DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}
afternoon: REQUEST c DO 'counselor hour' FOR 1h DURING ANY 1 {blocks.playstation + blocks.clinic_3}
GAP morning TO afternoon AT_MOST 5h

EXCLUDE staff.dylan DO 'offsite' DURING ALL_OF blocks.all ON 2026-08-05

• EXCLUDE is a fact, always MUST_HAPPEN, in a request of its own
• The label is what the schedule shows where they would have been
"""

[[problem]]
id = "gap-order"
title = "First this, then that"
prompt = "Charlton does 'fence posts' in one of the morning clinic blocks and 'fence rails' in one of the afternoon clinic blocks (3 or 4), with the rails after the posts."
answer = "posts: REQUEST staff.charlton DO 'fence posts' DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}\nrails: REQUEST staff.charlton DO 'fence rails' DURING ANY 1 {blocks.clinic_3 + blocks.clinic_4}\nGAP posts TO rails AT_LEAST 0m"
hints = ["Label each REQUEST with a name and a colon, then GAP posts TO rails AT_LEAST 0m."]
explain = "AT_LEAST 0m is plain ordering: the second starts after the first ends."
wrong = ["posts: REQUEST staff.charlton DO 'fence posts' DURING ANY 1 {blocks.clinic_1 + blocks.clinic_2}\nrails: REQUEST staff.charlton DO 'fence rails' DURING ANY 1 blocks.all_clinics\nGAP posts TO rails AT_LEAST 0m"]

[[problem]]
id = "gap-setup-teardown"
title = "Setup, then teardown"
prompt = "The same counselor does 'campfire setup' during clinic 4 and 'campfire teardown' during the evening program, and the teardown comes after the setup."
answer = "ANY 1 p IN staff.counselors\nfirst: REQUEST p DO 'campfire setup' DURING blocks.clinic_4\nlast:  REQUEST p DO 'campfire teardown' DURING blocks.evening_program\nGAP first TO last AT_LEAST 0m"
priority = "MEDIUM"
alternatives = ["ANY 1 p IN staff.counselors\nREQUEST p DO 'campfire setup' DURING blocks.clinic_4\nREQUEST p DO 'campfire teardown' DURING blocks.evening_program"]
wrong = ["ANY 1 p IN staff.counselors\nfirst: REQUEST p DO 'campfire setup' DURING blocks.clinic_4\nlast:  REQUEST staff.dylan DO 'campfire teardown' DURING blocks.evening_program\nGAP first TO last AT_LEAST 0m"]

[[problem]]
id = "away-day-off"
title = "Offsite"
prompt = "Dylan is away at a training course all day Wednesday; the schedule should say 'offsite' where he'd have been."
answer = "EXCLUDE staff.dylan DO 'offsite' DURING ALL_OF blocks.all ON 2026-08-05"
priority = "MUST_HAPPEN"
hints = ["EXCLUDE <who> DO '<label>' …"]
explain = "An EXCLUDE is a fact about the day, not a wish: it takes Dylan out of every block."
alternatives = ["EXCLUDE staff.dylan DO 'offsite' ON 2026-08-05", "EXCLUDE staff.dylan DO 'offsite' ON dates.session.six.week.one.wednesday"]
wrong = [
  "EXCLUDE staff.dylan DO 'offsite' ON 2026-08-06",
  "REQUEST staff.dylan FREE DURING ALL_OF blocks.all ON 2026-08-05",
]

[[problem]]
id = "away-dentist"
title = "A dentist's appointment"
prompt = "Hailey is at the 'dentist' during clinic 3 and clinic 4 today."
answer = "EXCLUDE staff.hailey DO 'dentist' DURING ALL_OF {blocks.clinic_3 + blocks.clinic_4}"
priority = "MUST_HAPPEN"
wrong = ["EXCLUDE staff.hailey DO 'dentist' DURING blocks.clinic_3"]

[[problem]]
id = "away-directors-meeting"
title = "Board meeting"
prompt = "All three directors are at a 'board meeting' offsite during the whole morning — setup, breakfast, clinic 1 and clinic 2 — on Thursday."
answer = "EXCLUDE ALL_OF staff.directors DO 'board meeting' DURING ALL_OF {blocks.setup + blocks.breakfast + blocks.clinic_1 + blocks.clinic_2} ON 2026-08-06"
priority = "MUST_HAPPEN"
alternatives = ["EXCLUDE ALL_OF {staff.david + staff.lisa + staff.matthew} DO 'board meeting' DURING ALL_OF {blocks.setup + blocks.breakfast + blocks.clinic_1 + blocks.clinic_2} ON dates.session.six.week.one.thursday"]
wrong = ["EXCLUDE ALL_OF staff.directors DO 'board meeting' DURING ALL_OF {blocks.breakfast + blocks.clinic_1 + blocks.clinic_2} ON 2026-08-06"]

[[problem]]
id = "away-label"
title = "The right words"
prompt = "Tyson is out at 'supply run' during the cabin act block today."
answer = "EXCLUDE staff.tyson DO 'supply run' DURING blocks.cabin_act"
priority = "MUST_HAPPEN"
wrong = ["EXCLUDE staff.tyson DO 'errand' DURING blocks.cabin_act"]

[[problem]]
id = "away-each"
title = "Two away"
prompt = "Kara and Khushi are both at 'orientation' during rest hour on Friday."
answer = "EXCLUDE ALL_OF {staff.kara + staff.khushi} DO 'orientation' DURING blocks.rest_hour ON 2026-08-07"
priority = "MUST_HAPPEN"
alternatives = ["EXCLUDE EACH_OF {staff.kara + staff.khushi} DO 'orientation' DURING blocks.rest_hour ON 2026-08-07"]
wrong = ["EXCLUDE staff.kara DO 'orientation' DURING blocks.rest_hour ON 2026-08-07"]

[[problem]]
id = "away-two-days"
title = "Two days out"
prompt = "Rob is away on 'vacation' Thursday and Friday."
answer = "EXCLUDE staff.rob DO 'vacation' ON ALL_OF {2026-08-06 .. 2026-08-07}"
priority = "MUST_HAPPEN"
alternatives = ["EXCLUDE staff.rob DO 'vacation' ON ALL_OF {2026-08-06 + 2026-08-07}", "EXCLUDE staff.rob DO 'vacation' DURING ALL_OF blocks.all ON ALL_OF {2026-08-06 .. 2026-08-07}"]
wrong = ["EXCLUDE staff.rob DO 'vacation' ON 2026-08-06"]

[[problem]]
id = "away-evening"
title = "Night off"
prompt = "Leah is off for the evening — 'night off' in both evening blocks today."
answer = "EXCLUDE staff.leah DO 'night off' DURING ALL_OF blocks.evening"
priority = "MUST_HAPPEN"
alternatives = ["EXCLUDE staff.leah DO 'night off' DURING ALL_OF {blocks.embers + blocks.evening_program}"]
wrong = ["EXCLUDE staff.leah DO 'night off' DURING blocks.evening_program"]
