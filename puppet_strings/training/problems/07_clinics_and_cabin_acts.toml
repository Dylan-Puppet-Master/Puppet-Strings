[level]
name = "Clinics and Cabin Acts"
blurb = "Activities with positions and skills, and the cabin act board."
day = "2026-08-04"
teaches = """
REQUEST activities.clinics.riflery DURING blocks.clinic_2
REQUEST staff.dylan DO activities.clinics.archery_1_2 DURING blocks.clinic_2
REQUEST staff.alan DO activities.clinics.climbing_wall AS_ROLE roles.first DURING blocks.clinic_1
REQUEST EACH activities.cabin_acts.at_cabin_act DURING blocks.cabin_act
REQUEST EACH activities.cabin_acts.at_rest_hour DURING blocks.rest_hour

• An activity knows who may run it (its positions need skills), so it
  needs no DO: REQUEST <activity> DURING <block> asks for it, fully staffed
• AS_ROLE picks a position: roles.first, roles.second, …
• roles.trainee is a trainee alongside the positions
• A cabin act belongs to one day, so activities.cabin_acts.p4 is today's P4
• An act titled "RH: …" runs at rest hour: it is in cabin_acts.at_rest_hour,
  and the rest are in cabin_acts.at_cabin_act
"""

[[problem]]
id = "clinic-riflery-runs"
title = "Riflery runs"
prompt = "Riflery runs during clinic 2 — whoever is qualified can staff it."
answer = "REQUEST activities.clinics.riflery DURING blocks.clinic_2"
hints = ["An activity with no DO: REQUEST activities.clinics.riflery DURING …"]
explain = "The clinic already says who may run it, so the request just names it."
alternatives = ["REQUEST ANY 1 staff DO activities.clinics.riflery DURING blocks.clinic_2"]
wrong = ["REQUEST activities.clinics.riflery DURING blocks.clinic_3"]

[[problem]]
id = "clinic-dylan-archery"
title = "Dylan on archery"
prompt = "Dylan runs Archery 1 & 2 during clinic 2."
answer = "REQUEST staff.dylan DO activities.clinics.archery_1_2 DURING blocks.clinic_2"
hints = ["Try typing 'archery' and pick Archery 1 & 2 from the list."]
alternatives = ["REQUEST staff.dylan DO activities.clinics.archery_1_2 AS_ROLE roles.first DURING blocks.clinic_2"]
wrong = ["REQUEST staff.dylan DO activities.clinics.archery_3 DURING blocks.clinic_2"]

[[problem]]
id = "clinic-alan-first-wall"
title = "First on the wall"
prompt = "Alan is first (the lead position) on the Climbing Wall during clinic 1."
answer = "REQUEST staff.alan DO activities.clinics.climbing_wall AS_ROLE roles.first DURING blocks.clinic_1"
hints = ["The lead position is roles.first, after AS_ROLE."]
wrong = [
  "REQUEST staff.alan DO activities.clinics.climbing_wall AS_ROLE roles.second DURING blocks.clinic_1",
  "REQUEST staff.alan DO activities.clinics.climbing_wall DURING blocks.clinic_1",
]

